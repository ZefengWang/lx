name: 构建安卓 APK

# 触发：
#  - workflow_dispatch：Actions 页面手动「Run workflow」
#  - push 到 main 且改动涉及 web 应用 / android 壳 / workflow 本身
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'app.html'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'version.txt'
      - 'icon-*.png'
      - 'android/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取版本号
        id: version
        run: echo "v=$(cat version.txt)" >> "$GITHUB_OUTPUT"

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Android SDK 命令行工具
        uses: android-actions/setup-android@v3

      - name: 接受 Android SDK 许可证（缺失组件由 Gradle 自动下载）
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          yes | sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: 同步 web 资源到 APK assets
        run: bash android/sync-assets.sh

      - name: 配置 Gradle（并生成 wrapper 供 gradlew 使用）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          cache-read-only: false

      - name: 构建 Debug APK（可直接安装，免签名配置）
        run: gradle -p android assembleDebug

      - name: 构建 Release APK（默认使用 Android 自动生成的 debug 签名，便于直接安装）
        run: gradle -p android assembleRelease

      - name: 上传 APK 构件
        uses: actions/upload-artifact@v4
        with:
          name: lx-apk-v${{ steps.version.outputs.v }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 发布 Release（仅 tag 触发时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          body: |
            ## 刷题器 v${{ steps.version.outputs.v }}

            一个纯静态的刷题 / 错题本应用（Web + Android 双端），离线可用、无需注册。

            ### 主要功能
            - 📚 **题库管理**：创建、导入（xlsx / json / pdf / 文本）、导出、多题库一键切换
            - 🧠 **多题型**：单选 / 多选 / 判断 / 填空 / 简答，自动判分（简答仅在填写答案后判分）
            - ❌ **错题本**：答错自动收录，错题专注模式，标记「我已掌握」实时移出并更新计数
            - 📊 **学习统计**：掌握率、学习进度、错题分布一目了然
            - 🔍 **题库浏览**：题干搜索（AND 过滤链）、分类筛选、滚动加载
            - 🎯 **练习模式**：快速练习（答对自动切题）与背诵记忆两种
            - 🎨 **主题系统**：12 色主题 × 3 种显示模式（普通 / 夜间 / 护眼）
            - 📱 **移动优先**：单手操作、底部操作区、左右滑切题、上下滑标记掌握 / 错题
            - 💾 **数据安全**：本地存储，进度可备份 / 恢复，不联网也完整可用
            - 🌐 **离线可用**：PWA + Service Worker，Android APK 内置全部资源

            ### 本版安装包
            - `app-release.apk`：推荐安装
            - `app-debug.apk`：调试用

            > 注：当前 APK 使用调试签名，可直接安装；手机安装时请允许「安装未知应用」。
