name: 构建安卓 APK

# 触发：
#  - workflow_dispatch：Actions 页面手动「Run workflow」
#  - push 到 main 且改动涉及 web 应用 / android 壳 / workflow 本身
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'app.html'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'version.txt'
      - 'icon-*.png'
      - 'android/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取版本号
        id: version
        run: echo "v=$(cat version.txt)" >> "$GITHUB_OUTPUT"

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Android SDK 命令行工具
        uses: android-actions/setup-android@v3

      - name: 接受 Android SDK 许可证（缺失组件由 Gradle 自动下载）
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          yes | sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: 同步 web 资源到 APK assets
        run: bash android/sync-assets.sh

      - name: 配置 Gradle（并生成 wrapper 供 gradlew 使用）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          cache-read-only: false

      - name: 构建 Debug APK（可直接安装，免签名配置）
        run: gradle -p android assembleDebug

      - name: 构建 Release APK（默认使用 Android 自动生成的 debug 签名，便于直接安装）
        run: gradle -p android assembleRelease

      - name: 上传 APK 构件
        uses: actions/upload-artifact@v4
        with:
          name: lx-apk-v${{ steps.version.outputs.v }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 发布 Release（仅 tag 触发时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
