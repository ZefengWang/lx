<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>刷题器</title>
    <!--
      为什么把 index.html 做成跳转而不是重复一份 app.html？
      - GitHub Pages 访问 https://zefengwang.github.io/lx/（目录路径）默认找 index.html
      - 之前 index.html 和 app.html 是两份完全相同的拷贝，极易出现"只改一份导致版本不一致"的隐性 bug
      - 所以这里用 0 秒 meta refresh 跳转到 app.html，保证任何时候用户永远只跑 app.html 这一份入口
      - noscript 里放了显式跳转链接，兼容关闭 JS + 旧浏览器不识别 meta refresh 的极端场景
    -->
    <meta http-equiv="refresh" content="0; url=./app.html">
    <link rel="icon" type="image/svg+xml" href="./src/render/assets/logo.svg">
</head>
<body>
    <p>正在跳转 <a href="./app.html">刷题器主页</a>…（如果没有自动跳转请点这里）</p>
    <noscript>
        <p>您的浏览器禁用了脚本 / 不支持自动跳转，<a href="./app.html">点此进入刷题器</a>。</p>
    </noscript>
</body>
</html>
