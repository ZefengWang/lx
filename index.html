<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>刷题器</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <!-- PDF.js 用于解析 PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
    <div class="app-container" id="app">
        <!-- 上传界面 -->
        <div id="uploadScreen" class="upload-placeholder" style="display:flex;">
            <div class="icon">📤</div>
            <div class="text">点击上传 或 拖拽 Excel / PDF / JSON 文件</div>
            <div class="hint">支持 .xlsx / .xls / .pdf / .json，自动解析题目和口诀</div>
            <input type="file" id="fileInput" accept=".xlsx,.xls,.pdf,.json">
        </div>

        <!-- 主界面 -->
        <div id="mainApp" style="display:none; flex-direction:column; height:100%;">
            <!-- 头部与之前完全相同，保持不变 -->
            <div class="app-header">
                <div class="header-top">
                    <h1>📚 刷题 <small id="appVersion">v2.3.5</small></h1>
                    <div class="library-selector">
                        <span style="font-size:13px;color:#64748b;">📂</span>
                        <select id="librarySelect"></select>
                        <button id="deleteLibraryBtn" title="删除当前题库">🗑️</button>
                        <button id="addLibraryBtn" title="上传新题库">➕</button>
                    </div>
                    <div class="stats-ring-wrapper">
                        <div class="ring-container">
                            <svg viewBox="0 0 48 48">
                                <circle class="bg" cx="24" cy="24" r="20" />
                                <circle class="progress-ring" id="progressRing" cx="24" cy="24" r="20"
                                stroke-dasharray="125.6" stroke-dashoffset="125.6" />
                            </svg>
                            <div class="center-text" id="ringPercent">0%</div>
                        </div>
                        <div class="stats-text">
                            <span>✅ <span class="num green" id="masteredCount">0</span> 掌握</span>
                            <span>🔄 <span class="num orange" id="reviewCount">0</span> 复习</span>
                        </div>
                    </div>
                </div>
                <div class="filter-bar">
                    <select id="categoryFilter"><option value="all">📂 全部</option></select>
                    <button id="manageCategoryBtn" style="padding:4px 8px;font-size:14px;border:none;background:none;cursor:pointer;" title="管理分类">✏️</button>
                    <select id="statusFilter">
                        <option value="all">📋 全部状态</option>
                        <option value="none">⏳ 未开始</option>
                        <option value="mastered">✅ 已掌握</option>
                        <option value="review">📕 错题本</option>
                    </select>
                    <select id="modeSelect">
                        <option value="sequential">➡️ 顺序</option>
                        <option value="random">🎲 随机</option>
                    </select>
                    <button id="wrongBookBtn" style="background:#fef3c7;color:#b45309;border:none;border-radius:20px;padding:6px 14px;font-weight:500;font-size:13px;cursor:pointer;flex-shrink:0;">
                        📕 错题本 <span id="wrongCount">0</span>
                    </button>
                    <button id="shuffleBtn">🔀 洗牌</button>
                </div>
            </div>

            <div class="card-slide-area" id="cardSlideArea">
                <div id="wrongBookBanner"></div>   <!-- 新增 -->
                <div class="card-wrapper" id="cardWrapper">
                    <div class="swipe-hint left">‹</div>
                    <div class="swipe-hint right">›</div>
                    <div id="cardContent">
                        <div class="empty-state">加载中...</div>
                    </div>
                    <div class="card-meta" id="cardMeta">
                        <span><span class="badge" id="categoryBadge">未分类</span>  #<span id="questionId">0</span></span>
                        <span class="status-tag none" id="statusTag">⏳ 未开始</span>
                    </div>
                </div>
                <div class="card-actions" id="cardActions">
                    <!-- 由 JS 动态生成 -->
                </div>
            </div>

            <div class="bottom-actions">
                <button class="btn-master" id="actionMaster">✅ 已掌握</button>
                <button class="btn-review" id="actionReview">📕 加入错题本</button>
                <button class="btn-reset" id="actionReset">↩️ 重置</button>
                <button class="btn-help" id="helpBtn">❓ 帮助</button>
            </div>

            <div class="bottom-utils">
                <div class="left-group">
                    <button id="addQuestionBtn" class="primary">➕ 添加题目</button>
                    <button id="pasteLibraryBtn" class="primary">📋 粘贴题库</button>
                    <button id="exportLibraryBtn" class="primary">📤 导出题库</button>
                    <button id="exportPdfBtn" class="primary">📤 导出JSON</button>
                    <button id="exportBtn">📥 导出进度</button>
                    <button id="copyBtn">📋 复制进度</button>
                    <button id="pasteImportBtn">📋 从剪贴板导入</button>
                    <button id="importBtn">📤 导入文件</button>
                    <input type="file" id="importFileInput" accept=".json,.xlsx,.xls,.pdf">
                </div>
                <div class="right-group">
                    <button id="resetAllBtn" class="danger">🗑️ 重置全部</button>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
