<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>多题库刷题器 · 交互版</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js">
    </script>
    <style>
        /* ===== 与上一版完全相同的样式，此处省略以节省篇幅（实际回答会包含完整样式） ===== */
        /* 为了完整性，这里提供完整样式，与上一版一致，未做修改 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #f1f5f9;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        .app-container {
            max-width: 820px;
            width: 100%;
            height: 100%;
            max-height: 900px;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .app-header {
            padding: 16px 24px 12px 24px;
            border-bottom: 1px solid #f0f2f5;
            flex-shrink: 0;
            background: white;
            z-index: 10;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }
        .header-top h1 {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
        }
        .header-top h1 small {
            font-size: 14px;
            font-weight: 400;
            color: #94a3b8;
            margin-left: 6px;
        }
        .library-selector {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f8fafc;
            padding: 4px 12px 4px 8px;
            border-radius: 30px;
            border: 1px solid #eef2f6;
        }
        .library-selector select {
            border: none;
            background: transparent;
            padding: 6px 4px;
            font-size: 14px;
            font-weight: 500;
            color: #0f172a;
            outline: none;
            max-width: 160px;
        }
        .library-selector button {
            background: none;
            border: none;
            color: #64748b;
            font-size: 18px;
            cursor: pointer;
            padding: 0 4px;
            transition: 0.15s;
        }
        .library-selector button:active {
            transform: scale(0.9);
        }
        .stats-ring-wrapper {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #f8fafc;
            padding: 8px 16px 8px 12px;
            border-radius: 40px;
            border: 1px solid #eef2f6;
        }
        .ring-container {
            position: relative;
            width: 48px;
            height: 48px;
            flex-shrink: 0;
        }
        .ring-container svg {
            transform: rotate(-90deg);
            width: 48px;
            height: 48px;
        }
        .ring-container .bg {
            fill: none;
            stroke: #e9edf2;
            stroke-width: 5;
        }
        .ring-container .progress-ring {
            fill: none;
            stroke: #4f46e5;
            stroke-width: 5;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.6s ease, stroke 0.3s;
        }
        .ring-container .center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 13px;
            font-weight: 700;
            color: #0f172a;
        }
        .stats-text {
            display: flex;
            flex-direction: column;
            font-size: 12px;
            color: #64748b;
            line-height: 1.4;
        }
        .stats-text .num {
            font-weight: 700;
            color: #0f172a;
            font-size: 14px;
        }
        .stats-text .num.green {
            color: #16a34a;
        }
        .stats-text .num.orange {
            color: #ea580c;
        }
        .filter-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .filter-bar::-webkit-scrollbar {
            display: none;
        }
        .filter-bar select,
        .filter-bar button {
            flex-shrink: 0;
            padding: 6px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            background: white;
            font-size: 13px;
            color: #334155;
            cursor: pointer;
            transition: 0.15s;
            outline: none;
            font-weight: 500;
            height: 36px;
        }
        .filter-bar select:active,
        .filter-bar button:active {
            transform: scale(0.96);
        }
        .filter-bar select:focus,
        .filter-bar button:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        .card-slide-area {
            flex: 1;
            padding: 16px 20px 12px 20px;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            overflow: hidden;
            touch-action: pan-y;
        }
        .card-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-radius: 20px;
            border: 2px solid #edf2f7;
            padding: 24px 20px 16px 20px;
            transition: border-color 0.25s, background 0.25s;
            background: white;
            min-height: 200px;
            position: relative;
            touch-action: none;
            overflow-y: auto;
        }
        .card-wrapper.mastered {
            border-color: #86efac;
            background: #f0fdf4;
        }
        .card-wrapper.review {
            border-color: #fdba74;
            background: #fff7ed;
        }
        .card-wrapper .swipe-hint {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 28px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            color: #94a3b8;
        }
        .card-wrapper .swipe-hint.left {
            left: 8px;
        }
        .card-wrapper .swipe-hint.right {
            right: 8px;
        }
        .card-question {
            font-size: 18px;
            line-height: 1.7;
            color: #0f172a;
            font-weight: 500;
            word-break: break-word;
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        .options-container {
            margin: 12px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .option-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.15s;
            background: #fafcff;
            user-select: none;
        }
        .option-item:active {
            transform: scale(0.98);
        }
        .option-item.selected {
            border-color: #4f46e5;
            background: #eef2ff;
        }
        .option-item.correct-answer {
            border-color: #16a34a;
            background: #dcfce7;
        }
        .option-item.wrong-answer {
            border-color: #dc2626;
            background: #fee2e2;
        }
        .option-item .option-label {
            font-weight: 600;
            color: #475569;
            min-width: 24px;
        }
        .option-item .option-text {
            flex: 1;
            color: #1e293b;
        }
        .option-item input[type="radio"],
        .option-item input[type="checkbox"] {
            display: none;
        }
        .judge-buttons {
            display: flex;
            gap: 16px;
            margin: 12px 0;
        }
        .judge-buttons button {
            flex: 1;
            padding: 14px 0;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 600;
            background: white;
            cursor: pointer;
            transition: 0.15s;
        }
        .judge-buttons button:active {
            transform: scale(0.94);
        }
        .judge-buttons button.selected-true {
            border-color: #16a34a;
            background: #dcfce7;
            color: #166534;
        }
        .judge-buttons button.selected-false {
            border-color: #dc2626;
            background: #fee2e2;
            color: #991b1b;
        }
        .judge-buttons button.correct {
            border-color: #16a34a;
            background: #dcfce7;
            color: #166534;
        }
        .judge-buttons button.wrong {
            border-color: #dc2626;
            background: #fee2e2;
            color: #991b1b;
        }
        .judge-buttons button:disabled {
            cursor: default;
            opacity: 0.8;
        }
        .fill-group {
            display: flex;
            gap: 12px;
            margin: 12px 0;
            flex-wrap: wrap;
        }
        .fill-group input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: 0.15s;
            min-width: 120px;
        }
        .fill-group input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        .fill-group button {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            background: #4f46e5;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }
        .fill-group button:active {
            transform: scale(0.94);
            background: #4338ca;
        }
        .multi-confirm {
            margin: 8px 0 12px 0;
            padding: 10px 0;
            border: none;
            border-radius: 12px;
            background: #4f46e5;
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.15s;
            width: 100%;
        }
        .multi-confirm:active {
            transform: scale(0.96);
            background: #4338ca;
        }
        .multi-confirm:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }
        .feedback {
            margin: 12px 0 8px 0;
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: 500;
            display: none;
        }
        .feedback.show {
            display: block;
        }
        .feedback.correct {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }
        .feedback.wrong {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }
        .feedback .explanation {
            margin-top: 6px;
            font-weight: 400;
            font-size: 14px;
            color: #475569;
        }
        .card-mnemonic {
            background: #f8fafc;
            border-radius: 12px;
            padding: 14px 18px;
            border-left: 4px solid #818cf8;
            margin: 8px 0 12px 0;
            display: none;
            flex-shrink: 0;
        }
        .card-mnemonic.show {
            display: block;
        }
        .card-mnemonic .label {
            font-size: 12px;
            font-weight: 600;
            color: #6366f1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .card-mnemonic .content {
            font-size: 15px;
            color: #1e293b;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .card-meta {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #94a3b8;
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px dashed #e9edf2;
            flex-shrink: 0;
        }
        .card-meta .badge {
            background: #eef2ff;
            color: #4f46e5;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 12px;
        }
        .card-meta .status-tag {
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-tag.mastered {
            background: #dcfce7;
            color: #166534;
        }
        .status-tag.review {
            background: #ffedd5;
            color: #9a3412;
        }
        .status-tag.none {
            background: #f1f5f9;
            color: #64748b;
        }
        .card-actions {
            flex-shrink: 0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
            padding: 8px 4px 4px 4px;
            border-top: 1px solid #f0f2f5;
        }
        .card-actions .hint-btn {
            background: #eef2ff;
            color: #4f46e5;
            border: none;
            border-radius: 20px;
            padding: 8px 18px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
            touch-action: manipulation;
            flex: 0 1 auto;
        }
        .card-actions .hint-btn:active {
            transform: scale(0.94);
            background: #c7d2fe;
        }
        .card-actions .hint-btn.showing {
            background: #f1f5f9;
            color: #64748b;
        }
        .card-actions .nav-group {
            display: flex;
            gap: 6px;
            flex: 1 1 auto;
            justify-content: flex-end;
        }
        .card-actions .nav-group button {
            padding: 8px 14px;
            border: none;
            border-radius: 20px;
            background: #f1f5f9;
            font-weight: 500;
            font-size: 14px;
            color: #1e293b;
            cursor: pointer;
            transition: 0.15s;
            touch-action: manipulation;
            white-space: nowrap;
        }
        .card-actions .nav-group button:active {
            transform: scale(0.94);
            background: #e2e8f0;
        }
        .card-actions .nav-group .random-btn {
            background: #eef2ff;
            color: #4f46e5;
        }
        .card-actions .nav-group .random-btn:active {
            background: #c7d2fe;
        }
        .bottom-actions {
            flex-shrink: 0;
            background: white;
            border-top: 1px solid #f0f2f5;
            padding: 12px 16px 16px 16px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 8px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.02);
        }
        .bottom-actions button {
            padding: 12px 0;
            border: none;
            border-radius: 16px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #f8fafc;
            color: #334155;
        }
        .bottom-actions button:active {
            transform: scale(0.92);
        }
        .bottom-actions .btn-master {
            background: #dcfce7;
            color: #166534;
        }
        .bottom-actions .btn-master:active {
            background: #bbf7d0;
        }
        .bottom-actions .btn-review {
            background: #ffedd5;
            color: #9a3412;
        }
        .bottom-actions .btn-review:active {
            background: #fed7aa;
        }
        .bottom-actions .btn-reset {
            background: #fee2e2;
            color: #991b1b;
        }
        .bottom-actions .btn-reset:active {
            background: #fecaca;
        }
        .bottom-actions .btn-help {
            background: #eef2ff;
            color: #4f46e5;
        }
        .bottom-actions .btn-help:active {
            background: #c7d2fe;
        }
        .bottom-utils {
            flex-shrink: 0;
            padding: 8px 16px 12px 16px;
            background: #fafcff;
            border-top: 1px solid #f0f2f5;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            font-size: 12px;
        }
        .bottom-utils .left-group {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .bottom-utils .right-group {
            display: flex;
            gap: 4px;
        }
        .bottom-utils button {
            background: none;
            border: none;
            color: #64748b;
            padding: 4px 10px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: 0.15s;
            touch-action: manipulation;
            white-space: nowrap;
        }
        .bottom-utils button:active {
            background: #e9edf2;
        }
        .bottom-utils .danger {
            color: #ef4444;
        }
        .bottom-utils .primary {
            color: #4f46e5;
        }
        .bottom-utils input[type="file"] {
            display: none;
        }
        .upload-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 40px 20px;
            text-align: center;
            border: 2px dashed #cbd5e1;
            border-radius: 24px;
            background: #fafcff;
            cursor: pointer;
            transition: 0.2s;
            min-height: 300px;
        }
        .upload-placeholder .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .upload-placeholder .text {
            font-weight: 500;
            color: #334155;
        }
        .upload-placeholder .hint {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 6px;
        }
        .upload-placeholder input {
            display: none;
        }
        .empty-state {
            text-align: center;
            color: #94a3b8;
            padding: 40px 0;
            font-size: 16px;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            backdrop-filter: blur(4px);
        }
        .modal-box {
            background: white;
            max-width: 92%;
            width: 540px;
            border-radius: 24px;
            padding: 24px 20px 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }
        .modal-box h3 {
            font-size: 18px;
            margin-bottom: 12px;
            color: #0f172a;
        }
        .modal-box .form-group {
            margin-bottom: 14px;
        }
        .modal-box .form-group label {
            display: block;
            font-weight: 500;
            font-size: 14px;
            color: #334155;
            margin-bottom: 4px;
        }
        .modal-box .form-group input,
        .modal-box .form-group select,
        .modal-box .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d1d9e6;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: 0.15s;
            font-family: inherit;
            background: white;
        }
        .modal-box .form-group input:focus,
        .modal-box .form-group select:focus,
        .modal-box .form-group textarea:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        .modal-box .form-group textarea {
            min-height: 60px;
            resize: vertical;
        }
        .modal-box .form-group .options-area {
            display: none;
            margin-top: 4px;
        }
        .modal-box .form-group .options-area textarea {
            min-height: 80px;
        }
        .modal-box .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            justify-content: flex-end;
        }
        .modal-box .modal-actions button {
            padding: 10px 24px;
            border: none;
            border-radius: 16px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.15s;
        }
        .modal-box .modal-actions .btn-primary {
            background: #4f46e5;
            color: white;
        }
        .modal-box .modal-actions .btn-primary:active {
            background: #4338ca;
        }
        .modal-box .modal-actions .btn-secondary {
            background: #f1f5f9;
            color: #334155;
        }
        .modal-box .modal-actions .btn-secondary:active {
            background: #e2e8f0;
        }
        @media (min-width: 768px) {
            body {
                padding: 24px;
                background: #e9edf2;
            }
            .app-container {
                max-height: 95vh;
                border-radius: 28px;
                box-shadow: 0 25px 80px rgba(0, 0, 0, 0.12);
            }
            .app-header {
                padding: 24px 32px 16px 32px;
            }
            .header-top h1 {
                font-size: 26px;
            }
            .card-slide-area {
                padding: 24px 32px 16px 32px;
            }
            .card-wrapper {
                padding: 36px 40px 20px 40px;
                min-height: 280px;
                border-radius: 24px;
            }
            .card-question {
                font-size: 20px;
            }
            .card-actions {
                margin-top: 16px;
                padding: 12px 4px 4px 4px;
            }
            .card-actions .nav-group button:hover {
                background: #e2e8f0;
            }
            .card-actions .hint-btn:hover {
                background: #c7d2fe;
            }
            .bottom-actions {
                padding: 16px 32px 20px 32px;
                gap: 12px;
            }
            .bottom-actions button {
                font-size: 16px;
                padding: 14px 0;
                border-radius: 20px;
            }
            .bottom-actions button:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 16px rgba(0, 0, 0, 0.05);
            }
            .bottom-utils {
                padding: 10px 32px 16px 32px;
            }
            .bottom-utils button:hover {
                background: #e9edf2;
                color: #0f172a;
            }
            .upload-placeholder {
                min-height: 400px;
            }
        }
        @media (max-width: 400px) {
            .app-header {
                padding: 12px 16px 8px 16px;
            }
            .header-top h1 {
                font-size: 17px;
            }
            .stats-ring-wrapper {
                padding: 4px 12px 4px 8px;
                gap: 10px;
            }
            .ring-container {
                width: 40px;
                height: 40px;
            }
            .ring-container svg {
                width: 40px;
                height: 40px;
            }
            .ring-container .center-text {
                font-size: 11px;
            }
            .stats-text {
                font-size: 10px;
            }
            .card-wrapper {
                padding: 18px 16px 12px 16px;
                min-height: 160px;
            }
            .card-question {
                font-size: 16px;
            }
            .card-actions {
                gap: 6px;
                padding: 6px 0 0 0;
            }
            .card-actions .nav-group button {
                font-size: 12px;
                padding: 6px 10px;
            }
            .card-actions .hint-btn {
                font-size: 12px;
                padding: 6px 14px;
            }
            .bottom-actions {
                padding: 8px 10px 12px 10px;
                gap: 6px;
            }
            .bottom-actions button {
                font-size: 12px;
                padding: 10px 0;
                border-radius: 12px;
            }
            .bottom-utils {
                padding: 6px 10px 10px 10px;
                font-size: 11px;
            }
            .bottom-utils button {
                font-size: 11px;
                padding: 4px 8px;
            }
        }
        .card-wrapper::-webkit-scrollbar {
            width: 4px;
        }
        .card-wrapper::-webkit-scrollbar-thumb {
            background: #d1d9e6;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="app-container" id="app">
        <!-- 上传界面 -->
        <div id="uploadScreen" class="upload-placeholder" style="display:flex;">
            <div class="icon">📤</div>
            <div class="text">点击上传 或 拖拽 Excel 文件</div>
            <div class="hint">支持 .xlsx / .xls，自动解析三大模块</div>
            <input type="file" id="fileInput" accept=".xlsx,.xls">
        </div>

        <!-- 主界面 -->
        <div id="mainApp" style="display:none; flex-direction:column; height:100%;">
            <!-- 头部 -->
            <div class="app-header">
                <div class="header-top">
                    <h1>📚 刷题 <small>交互版</small></h1>
                    <div class="library-selector">
                        <span style="font-size:13px;color:#64748b;">📂</span>
                        <select id="librarySelect"></select>
                        <button id="deleteLibraryBtn" title="删除当前题库">🗑️</button>
                        <button id="addLibraryBtn" title="上传新题库">➕</button>
                    </div>
                    <div class="stats-ring-wrapper">
                        <div class="ring-container">
                            <svg viewBox="0 0 48 48">
                                <circle class="bg" cx="24" cy="24" r="20" />
                                <circle class="progress-ring" id="progressRing" cx="24" cy="24" r="20"
                                stroke-dasharray="125.6" stroke-dashoffset="125.6" />
                            </svg>
                            <div class="center-text" id="ringPercent">0%</div>
                        </div>
                        <div class="stats-text">
                            <span>✅ <span class="num green" id="masteredCount">0</span> 掌握</span>
                            <span>🔄 <span class="num orange" id="reviewCount">0</span> 复习</span>
                        </div>
                    </div>
                </div>
                <div class="filter-bar">
                    <select id="categoryFilter"><option value="all">📂 全部</option></select>
                    <select id="statusFilter">
                        <option value="all">📋 全部状态</option>
                        <option value="none">⏳ 未开始</option>
                        <option value="mastered">✅ 已掌握</option>
                        <option value="review">🔄 待复习</option>
                    </select>
                    <select id="modeSelect">
                        <option value="sequential">➡️ 顺序</option>
                        <option value="random">🎲 随机</option>
                    </select>
                    <button id="shuffleBtn">🔀 洗牌</button>
                </div>
            </div>

            <!-- 卡片区域 -->
            <div class="card-slide-area" id="cardSlideArea">
                <div class="card-wrapper" id="cardWrapper">
                    <div class="swipe-hint left">‹</div>
                    <div class="swipe-hint right">›</div>
                    <div id="cardContent">
                        <div class="empty-state">加载中...</div>
                    </div>
                    <div class="card-meta" id="cardMeta">
                        <span><span class="badge" id="categoryBadge">未分类</span>  #<span id="questionId">0</span></span>
                        <span class="status-tag none" id="statusTag">⏳ 未开始</span>
                    </div>
                </div>
                <!-- 卡片下方操作栏 -->
                <div class="card-actions" id="cardActions">
                    <button class="hint-btn" id="hintBtn">💡 提示</button>
                    <div class="nav-group">
                        <button id="prevBtn">◀ 上一题</button>
                        <button id="randomBtn" class="random-btn">🎲 随机</button>
                        <button id="nextBtn">下一题 ▶</button>
                    </div>
                </div>
            </div>

            <!-- 底部操作栏 -->
            <div class="bottom-actions">
                <button class="btn-master" id="actionMaster">✅ 掌握</button>
                <button class="btn-review" id="actionReview">🔄 复习</button>
                <button class="btn-reset" id="actionReset">↩️ 重置</button>
                <button class="btn-help" id="helpBtn">❓ 帮助</button>
            </div>

            <!-- 底部工具条 -->
            <div class="bottom-utils">
                <div class="left-group">
                    <button id="addQuestionBtn" class="primary">➕ 添加题目</button>
                    <button id="exportLibraryBtn" class="primary">📤 导出题库</button>
                    <button id="exportBtn">📥 导出进度</button>
                    <button id="copyBtn">📋 复制进度</button>
                    <button id="pasteImportBtn">📋 从剪贴板导入</button>
                    <button id="importBtn">📤 导入文件</button>
                    <input type="file" id="importFileInput" accept=".json,.xlsx,.xls">
                </div>
                <div class="right-group">
                    <button id="resetAllBtn" class="danger">🗑️ 重置全部</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ==================== DOM 引用 ====================
            const uploadScreen = document.getElementById('uploadScreen');
            const mainApp = document.getElementById('mainApp');
            const fileInput = document.getElementById('fileInput');
            const librarySelect = document.getElementById('librarySelect');
            const deleteLibraryBtn = document.getElementById('deleteLibraryBtn');
            const addLibraryBtn = document.getElementById('addLibraryBtn');
            const categoryFilter = document.getElementById('categoryFilter');
            const statusFilter = document.getElementById('statusFilter');
            const modeSelect = document.getElementById('modeSelect');
            const shuffleBtn = document.getElementById('shuffleBtn');
            const cardContent = document.getElementById('cardContent');
            const cardWrapper = document.getElementById('cardWrapper');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const randomBtn = document.getElementById('randomBtn');
            const hintBtn = document.getElementById('hintBtn');
            const actionMaster = document.getElementById('actionMaster');
            const actionReview = document.getElementById('actionReview');
            const actionReset = document.getElementById('actionReset');
            const helpBtn = document.getElementById('helpBtn');
            const exportBtn = document.getElementById('exportBtn');
            const copyBtn = document.getElementById('copyBtn');
            const pasteImportBtn = document.getElementById('pasteImportBtn');
            const importBtn = document.getElementById('importBtn');
            const importFileInput = document.getElementById('importFileInput');
            const resetAllBtn = document.getElementById('resetAllBtn');
            const addQuestionBtn = document.getElementById('addQuestionBtn');
            const exportLibraryBtn = document.getElementById('exportLibraryBtn');
            const progressRing = document.getElementById('progressRing');
            const ringPercent = document.getElementById('ringPercent');
            const masteredCount = document.getElementById('masteredCount');
            const reviewCount = document.getElementById('reviewCount');
            const categoryBadge = document.getElementById('categoryBadge');
            const questionId = document.getElementById('questionId');
            const statusTag = document.getElementById('statusTag');

            // ==================== 全局状态 ====================
            let allLibraries = {};
            let currentLibraryId = null;
            let currentQuestions = [];
            let filteredQuestions = [];
            let currentIndex = 0;
            let isMnemonicVisible = false;
            let currentMode = 'sequential';
            let currentCategory = 'all';
            let currentStatusFilter = 'all';

            // 存储键
            const LIBRARY_LIST_KEY = 'studyLibraries_v4';
            const PROGRESS_KEY = 'studyProgress_v4';

            // ==================== 进度管理 ====================
            function loadLibraries() {
                try {
                    const raw = localStorage.getItem(LIBRARY_LIST_KEY);
                    if (raw) return JSON.parse(raw);
                } catch (e) { /* ignore */ }
                return {};
            }

            function saveLibraries(libs) {
                localStorage.setItem(LIBRARY_LIST_KEY, JSON.stringify(libs));
            }

            function loadProgress() {
                try {
                    const raw = localStorage.getItem(PROGRESS_KEY);
                    if (raw) return JSON.parse(raw);
                } catch (e) { /* ignore */ }
                return {};
            }

            function saveProgress(progress) {
                localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
            }

            function getLibraryProgress(libId) {
                const all = loadProgress();
                return all[libId] || {};
            }

            function setLibraryProgress(libId, progress) {
                const all = loadProgress();
                all[libId] = progress;
                saveProgress(all);
            }

            function getQuestionStatus(libId, qId) {
                const prog = getLibraryProgress(libId);
                return prog[qId] || 'none';
            }

            function setQuestionStatus(libId, qId, status) {
                const prog = getLibraryProgress(libId);
                if (status === 'none') delete prog[qId];
                else prog[qId] = status;
                setLibraryProgress(libId, prog);
                updateStatsAndUI();
                renderCard();
            }

            function resetAllProgressForLibrary(libId) {
                if (confirm(`确定要重置题库“${allLibraries[libId].name}”的所有进度吗？`)) {
                    setLibraryProgress(libId, {});
                    updateStatsAndUI();
                    renderCard();
                }
            }

            // ==================== 统计 ====================
            function calcStatsForLibrary(libId) {
                const questions = allLibraries[libId]?.questions || [];
                const total = questions.length;
                const prog = getLibraryProgress(libId);
                let mastered = 0,
                    review = 0;
                questions.forEach(q => {
                    const s = prog[q.id] || 'none';
                    if (s === 'mastered') mastered++;
                    else if (s === 'review') review++;
                });
                const pct = total > 0 ? Math.round((mastered / total) * 100) : 0;
                return { total, mastered, review, pct };
            }

            function updateStatsAndUI() {
                if (!currentLibraryId || !allLibraries[currentLibraryId]) {
                    masteredCount.textContent = '0';
                    reviewCount.textContent = '0';
                    ringPercent.textContent = '0%';
                    progressRing.style.strokeDashoffset = 125.6;
                    return;
                }
                const stats = calcStatsForLibrary(currentLibraryId);
                masteredCount.textContent = stats.mastered;
                reviewCount.textContent = stats.review;
                const circumference = 125.6;
                const offset = circumference - (stats.pct / 100) * circumference;
                progressRing.style.strokeDashoffset = offset;
                ringPercent.textContent = stats.pct + '%';
                if (stats.pct >= 80) progressRing.style.stroke = '#16a34a';
                else if (stats.pct >= 40) progressRing.style.stroke = '#eab308';
                else progressRing.style.stroke = '#4f46e5';
            }

            // ==================== 渲染卡片（含交互） ====================
            function renderCard() {
                if (!currentLibraryId || !allLibraries[currentLibraryId]) {
                    cardContent.innerHTML = `<div class="empty-state">请先上传或选择一个题库</div>`;
                    cardWrapper.className = 'card-wrapper';
                    updateStatsAndUI();
                    return;
                }
                const questions = currentQuestions;
                if (!questions.length) {
                    cardContent.innerHTML = `<div class="empty-state">当前题库为空</div>`;
                    cardWrapper.className = 'card-wrapper';
                    updateStatsAndUI();
                    return;
                }
                if (!filteredQuestions.length) {
                    cardContent.innerHTML = `<div class="empty-state">当前筛选无题目</div>`;
                    cardWrapper.className = 'card-wrapper';
                    updateStatsAndUI();
                    return;
                }
                if (currentIndex >= filteredQuestions.length) currentIndex = filteredQuestions.length - 1;
                if (currentIndex < 0) currentIndex = 0;

                const q = filteredQuestions[currentIndex];
                if (!q) { cardContent.innerHTML = `<div class="empty-state">加载失败</div>`; return; }

                const status = getQuestionStatus(currentLibraryId, q.id);
                cardWrapper.className = 'card-wrapper';
                if (status === 'mastered') cardWrapper.classList.add('mastered');
                else if (status === 'review') cardWrapper.classList.add('review');

                categoryBadge.textContent = q.category || '未分类';
                questionId.textContent = q.id;
                statusTag.className = 'status-tag ' + status;
                statusTag.textContent = status === 'mastered' ? '✅ 已掌握' : status === 'review' ? '🔄 待复习' : '⏳ 未开始';

                let html = `<div class="card-question">${escapeHtml(q.question)}</div>`;
                const type = q.type || 'essay';

                if (type === 'single') {
                    const options = q.options || [];
                    const correctAnswer = q.answer ? q.answer.trim().toUpperCase() : '';
                    html += `<div class="options-container" id="optionsContainer">`;
                    options.forEach((opt, idx) => {
                        const label = String.fromCharCode(65 + idx);
                        const isCorrect = (label === correctAnswer);
                        html += `
                            <div class="option-item" data-label="${label}" data-correct="${isCorrect}">
                                <span class="option-label">${label}.</span>
                                <span class="option-text">${escapeHtml(opt)}</span>
                            </div>
                        `;
                    });
                    html += `</div>`;
                    html += `<div class="feedback" id="feedback"></div>`;
                } else if (type === 'multi') {
                    const options = q.options || [];
                    const correctAnswers = q.answer ? q.answer.split(/[,，\s]+/).map(s => s.trim().toUpperCase()).filter(Boolean) :
                    [];
                    html += `<div class="options-container" id="optionsContainer">`;
                    options.forEach((opt, idx) => {
                        const label = String.fromCharCode(65 + idx);
                        html += `
                            <div class="option-item" data-label="${label}">
                                <span class="option-label">${label}.</span>
                                <span class="option-text">${escapeHtml(opt)}</span>
                            </div>
                        `;
                    });
                    html += `</div>`;
                    html += `<button class="multi-confirm" id="multiConfirm">确认答案</button>`;
                    html += `<div class="feedback" id="feedback"></div>`;
                } else if (type === 'judge') {
                    const correctAnswer = q.answer ? q.answer.trim() : '';
                    html += `<div class="judge-buttons" id="judgeButtons">`;
                    html += `<button data-value="对" class="judge-btn">✅ 对</button>`;
                    html += `<button data-value="错" class="judge-btn">❌ 错</button>`;
                    html += `</div>`;
                    html += `<div class="feedback" id="feedback"></div>`;
                } else if (type === 'fill') {
                    const correctAnswer = q.answer ? q.answer.trim() : '';
                    html += `<div class="fill-group" id="fillGroup">`;
                    html += `<input type="text" id="fillInput" placeholder="输入答案...">`;
                    html += `<button id="fillConfirm">确认答案</button>`;
                    html += `</div>`;
                    html += `<div class="feedback" id="feedback"></div>`;
                }

                const explanation = q.explanation || q.mnemonic || '';
                html += `
                    <div class="card-mnemonic ${isMnemonicVisible ? 'show' : ''}">
                        <div class="label">📌 ${type === 'essay' ? '口诀' : '解析'}</div>
                        <div class="content">${escapeHtml(explanation)}</div>
                    </div>
                `;
                cardContent.innerHTML = html;

                // ---- 绑定交互事件 ----
                if (type === 'single') {
                    const items = cardContent.querySelectorAll('.option-item');
                    const feedback = document.getElementById('feedback');
                    items.forEach(item => {
                        item.addEventListener('click', function() {
                            items.forEach(el => {
                                el.classList.remove('selected', 'correct-answer', 'wrong-answer');
                            });
                            this.classList.add('selected');
                            const isCorrect = this.dataset.correct === 'true';
                            if (isCorrect) {
                                this.classList.add('correct-answer');
                                feedback.className = 'feedback show correct';
                                feedback.innerHTML = '✅ 回答正确！';
                            } else {
                                this.classList.add('wrong-answer');
                                feedback.className = 'feedback show wrong';
                                feedback.innerHTML = '❌ 回答错误。正确答案是：' + (q.answer || '');
                            }
                            const expl = explanation.trim();
                            if (expl && expl !== '（无口诀）') {
                                const explDiv = document.createElement('div');
                                explDiv.className = 'explanation';
                                explDiv.textContent = '📖 解析：' + expl;
                                feedback.appendChild(explDiv);
                            }
                            items.forEach(el => el.style.pointerEvents = 'none');
                        });
                    });
                } else if (type === 'multi') {
                    const items = cardContent.querySelectorAll('.option-item');
                    const confirmBtn = document.getElementById('multiConfirm');
                    const feedback = document.getElementById('feedback');
                    let selectedLabels = [];

                    items.forEach(item => {
                        item.addEventListener('click', function() {
                            const label = this.dataset.label;
                            this.classList.toggle('selected');
                            if (this.classList.contains('selected')) {
                                if (!selectedLabels.includes(label)) selectedLabels.push(label);
                            } else {
                                selectedLabels = selectedLabels.filter(l => l !== label);
                            }
                            feedback.className = 'feedback';
                            feedback.innerHTML = '';
                            items.forEach(el => {
                                el.classList.remove('correct-answer', 'wrong-answer');
                            });
                            confirmBtn.disabled = false;
                        });
                    });

                    confirmBtn.addEventListener('click', function() {
                        if (selectedLabels.length === 0) {
                            alert('请至少选择一个选项');
                            return;
                        }
                        const correctAnswers = q.answer ? q.answer.split(/[,，\s]+/).map(s => s.trim().toUpperCase())
                            .filter(Boolean) : [];
                        let allCorrect = true;
                        items.forEach(el => {
                            const label = el.dataset.label;
                            const isCorrect = correctAnswers.includes(label);
                            if (isCorrect) {
                                el.classList.add('correct-answer');
                            } else {
                                el.classList.add('wrong-answer');
                            }
                            const userSelected = selectedLabels.includes(label);
                            if (userSelected && !isCorrect) allCorrect = false;
                            if (!userSelected && isCorrect) allCorrect = false;
                        });
                        if (allCorrect && selectedLabels.length === correctAnswers.length) {
                            feedback.className = 'feedback show correct';
                            feedback.innerHTML = '✅ 全部正确！';
                        } else {
                            feedback.className = 'feedback show wrong';
                            feedback.innerHTML = '❌ 有误，正确答案：' + correctAnswers.join(', ');
                        }
                        const expl = explanation.trim();
                        if (expl && expl !== '（无口诀）') {
                            const explDiv = document.createElement('div');
                            explDiv.className = 'explanation';
                            explDiv.textContent = '📖 解析：' + expl;
                            feedback.appendChild(explDiv);
                        }
                        confirmBtn.disabled = true;
                        items.forEach(el => el.style.pointerEvents = 'none');
                    });
                } else if (type === 'judge') {
                    const btns = cardContent.querySelectorAll('.judge-btn');
                    const feedback = document.getElementById('feedback');
                    const correctAnswer = q.answer ? q.answer.trim() : '';
                    btns.forEach(btn => {
                        btn.addEventListener('click', function() {
                            const value = this.dataset.value;
                            const isCorrect = (value === correctAnswer);
                            btns.forEach(b => {
                                b.classList.remove('selected-true', 'selected-false', 'correct',
                                    'wrong');
                                b.disabled = true;
                            });
                            if (isCorrect) {
                                this.classList.add('correct');
                                feedback.className = 'feedback show correct';
                                feedback.innerHTML = '✅ 回答正确！';
                            } else {
                                this.classList.add('wrong');
                                feedback.className = 'feedback show wrong';
                                feedback.innerHTML = '❌ 回答错误。正确答案：' + correctAnswer;
                            }
                            const expl = explanation.trim();
                            if (expl && expl !== '（无口诀）') {
                                const explDiv = document.createElement('div');
                                explDiv.className = 'explanation';
                                explDiv.textContent = '📖 解析：' + expl;
                                feedback.appendChild(explDiv);
                            }
                        });
                    });
                } else if (type === 'fill') {
                    const input = document.getElementById('fillInput');
                    const confirmBtn = document.getElementById('fillConfirm');
                    const feedback = document.getElementById('feedback');
                    const correctAnswer = q.answer ? q.answer.trim() : '';

                    confirmBtn.addEventListener('click', function() {
                        const userAns = input.value.trim();
                        if (!userAns) {
                            alert('请输入答案');
                            return;
                        }
                        const isCorrect = userAns.toLowerCase() === correctAnswer.toLowerCase();
                        if (isCorrect) {
                            feedback.className = 'feedback show correct';
                            feedback.innerHTML = '✅ 回答正确！';
                        } else {
                            feedback.className = 'feedback show wrong';
                            feedback.innerHTML = '❌ 回答错误。正确答案：' + correctAnswer;
                        }
                        const expl = explanation.trim();
                        if (expl && expl !== '（无口诀）') {
                            const explDiv = document.createElement('div');
                            explDiv.className = 'explanation';
                            explDiv.textContent = '📖 解析：' + expl;
                            feedback.appendChild(explDiv);
                        }
                        input.disabled = true;
                        confirmBtn.disabled = true;
                    });
                    input.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter') {
                            confirmBtn.click();
                        }
                    });
                }

                hintBtn.textContent = isMnemonicVisible ? '🙈 隐藏提示' : '💡 提示';
                hintBtn.className = 'hint-btn' + (isMnemonicVisible ? ' showing' : '');
                updateStatsAndUI();
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ==================== 导航 ====================
            function navigate(delta) {
                if (!filteredQuestions.length) return;
                isMnemonicVisible = false;
                let newIdx = currentIndex + delta;
                if (newIdx < 0) newIdx = filteredQuestions.length - 1;
                if (newIdx >= filteredQuestions.length) newIdx = 0;
                currentIndex = newIdx;
                if (currentMode === 'random') {
                    currentMode = 'sequential';
                    modeSelect.value = 'sequential';
                }
                renderCard();
            }

            function goRandom() {
                if (!filteredQuestions.length) return;
                isMnemonicVisible = false;
                if (currentMode !== 'random') {
                    currentMode = 'random';
                    modeSelect.value = 'random';
                }
                const randomIdx = Math.floor(Math.random() * filteredQuestions.length);
                currentIndex = randomIdx;
                renderCard();
            }

            function toggleHint() {
                if (!currentLibraryId || !filteredQuestions.length) return;
                isMnemonicVisible = !isMnemonicVisible;
                renderCard();
            }

            // ==================== 筛选 ====================
            function applyFilters() {
                if (!currentLibraryId || !allLibraries[currentLibraryId]) {
                    filteredQuestions = [];
                    renderCard();
                    return;
                }
                const questions = allLibraries[currentLibraryId].questions || [];
                const category = categoryFilter.value;
                const status = statusFilter.value;
                currentCategory = category;
                currentStatusFilter = status;

                let filtered = questions;
                if (category !== 'all') {
                    filtered = filtered.filter(q => q.category === category);
                }
                if (status !== 'all') {
                    filtered = filtered.filter(q => {
                        const s = getQuestionStatus(currentLibraryId, q.id);
                        return s === status;
                    });
                }

                filteredQuestions = filtered;
                if (filteredQuestions.length) currentIndex = 0;
                else currentIndex = 0;

                isMnemonicVisible = false;

                if (currentMode === 'random') shuffleArray(filteredQuestions);
                renderCard();
            }

            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
            }

            function reshuffle() {
                if (currentMode === 'random') {
                    shuffleArray(filteredQuestions);
                    currentIndex = 0;
                    isMnemonicVisible = false;
                    renderCard();
                } else {
                    alert('当前为顺序模式，请切换到随机模式再洗牌');
                }
            }

            // ==================== 题库管理（修复版） ====================
            function loadAllLibraries() {
                allLibraries = loadLibraries();
                Object.keys(allLibraries).forEach(id => {
                    if (!allLibraries[id].id) allLibraries[id].id = id;
                });
                updateLibrarySelector();
                const lastLib = localStorage.getItem('lastLibraryId');
                if (lastLib && allLibraries[lastLib]) {
                    switchToLibrary(lastLib);
                } else {
                    const ids = Object.keys(allLibraries);
                    if (ids.length) {
                        switchToLibrary(ids[0]);
                    } else {
                        // 无题库，显示上传界面
                        uploadScreen.style.display = 'flex';
                        mainApp.style.display = 'none';
                        currentLibraryId = null;
                        currentQuestions = [];
                        filteredQuestions = [];
                        renderCard();
                    }
                }
            }

            function updateLibrarySelector() {
                const current = librarySelect.value;
                librarySelect.innerHTML = '';
                Object.keys(allLibraries).forEach(id => {
                    const opt = document.createElement('option');
                    opt.value = id;
                    opt.textContent = allLibraries[id].name || '未命名题库';
                    librarySelect.appendChild(opt);
                });
                if (current && allLibraries[current]) {
                    librarySelect.value = current;
                } else if (Object.keys(allLibraries).length) {
                    librarySelect.value = Object.keys(allLibraries)[0];
                }
            }

            function switchToLibrary(libId) {
                if (!allLibraries[libId]) return;
                currentLibraryId = libId;
                currentQuestions = allLibraries[libId].questions || [];
                localStorage.setItem('lastLibraryId', libId);
                librarySelect.value = libId;
                // 更新分类下拉
                const cats = new Set();
                currentQuestions.forEach(q => cats.add(q.category));
                categoryFilter.innerHTML = '<option value="all">📂 全部</option>';
                cats.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c;
                    opt.textContent = c;
                    categoryFilter.appendChild(opt);
                });
                isMnemonicVisible = false;
                applyFilters();
            }

            // ***** 修复 deleteLibrary：彻底重置状态 *****
            function deleteLibrary(libId) {
                if (!allLibraries[libId]) return;
                if (!confirm(`确定要删除题库“${allLibraries[libId].name}”及其所有进度吗？`)) return;
                delete allLibraries[libId];
                saveLibraries(allLibraries);
                const allProgress = loadProgress();
                delete allProgress[libId];
                saveProgress(allProgress);
                const ids = Object.keys(allLibraries);
                if (ids.length) {
                    switchToLibrary(ids[0]);
                    updateLibrarySelector();
                } else {
                    // 没有题库了，显示上传界面，并重置所有状态
                    uploadScreen.style.display = 'flex';
                    mainApp.style.display = 'none';
                    currentLibraryId = null;
                    currentQuestions = [];
                    filteredQuestions = [];
                    currentIndex = 0;
                    isMnemonicVisible = false;
                    renderCard();
                    updateLibrarySelector(); // 清空下拉
                    // 清除 lastLibraryId
                    localStorage.removeItem('lastLibraryId');
                }
            }

            // ***** 修复 addNewLibrary：确保界面正确切换 *****
            function addNewLibrary(name, questions) {
                const id = 'lib_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
                allLibraries[id] = { id, name, questions };
                saveLibraries(allLibraries);
                setLibraryProgress(id, {});
                // 先更新下拉
                updateLibrarySelector();
                // 再切换库
                switchToLibrary(id);
                // 最后显示主界面
                uploadScreen.style.display = 'none';
                mainApp.style.display = 'flex';
            }

            // ==================== 导入题库（支持 Excel 和 JSON） ====================
            function handleFileUpload(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const parsed = parseExcelData(workbook);
                        if (!parsed.length) {
                            alert('未能解析出题目，请检查 Excel 格式。');
                            return;
                        }
                        parsed.sort((a, b) => a.id - b.id);
                        const matchedId = findMatchingLibrary(parsed);
                        if (matchedId) {
                            const libName = allLibraries[matchedId].name;
                            if (confirm(`检测到题库“${libName}”与当前上传内容相同，是否切换到该题库？\n（点击“确定”切换，点击“取消”仍新建）`)) {
                                switchToLibrary(matchedId);
                                uploadScreen.style.display = 'none';
                                mainApp.style.display = 'flex';
                                return;
                            }
                        }
                        const defaultName = file.name.replace(/\.[^.]+$/, '');
                        promptForLibraryName(defaultName, (name) => {
                            if (name) {
                                addNewLibrary(name, parsed);
                            }
                        });
                    } catch (err) {
                        alert('解析失败：' + err.message);
                    }
                };
                reader.readAsArrayBuffer(file);
            }

            function importJsonLibrary(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const libData = JSON.parse(e.target.result);
                        if (!libData.questions || !Array.isArray(libData.questions) || libData.questions.length === 0) {
                            alert('无效的 JSON 题库文件');
                            return;
                        }
                        const questions = libData.questions.map(q => ({
                            id: q.id || 0,
                            category: q.category || '未分类',
                            question: q.question || '',
                            type: q.type || 'essay',
                            options: q.options || [],
                            answer: q.answer || '',
                            explanation: q.explanation || q.mnemonic || '',
                            mnemonic: q.mnemonic || q.explanation || ''
                        }));
                        questions.forEach((q, idx) => q.id = idx + 1);
                        const name = libData.name || file.name.replace(/\.[^.]+$/, '') || '导入的题库';
                        const matchedId = findMatchingLibrary(questions);
                        if (matchedId) {
                            if (confirm(`检测到题库“${allLibraries[matchedId].name}”与当前导入内容相同，是否切换到该题库？`)) {
                                switchToLibrary(matchedId);
                                uploadScreen.style.display = 'none';
                                mainApp.style.display = 'flex';
                                return;
                            }
                        }
                        addNewLibrary(name, questions);
                    } catch (err) {
                        alert('JSON 解析失败：' + err.message);
                    }
                };
                reader.readAsText(file);
            }

            function findMatchingLibrary(questions) {
                const sortedNew = [...questions].sort((a, b) => a.id - b.id);
                const ids = Object.keys(allLibraries);
                for (let id of ids) {
                    const existing = allLibraries[id].questions;
                    if (existing.length !== sortedNew.length) continue;
                    const sortedExisting = [...existing].sort((a, b) => a.id - b.id);
                    if (JSON.stringify(sortedExisting) === JSON.stringify(sortedNew)) {
                        return id;
                    }
                }
                return null;
            }

            function promptForLibraryName(defaultName, callback) {
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.innerHTML = `

                input.focus();

                const close = () => overlay.remove();
                overlay.querySelector('#modalCancelBtn').addEventListener('click', () => {

                    callback(null);
                });
                overlay.querySelector('#modalConfirmBtn').addEventListener('click', () => {

            // ==================== 解析 Excel ====================
            function parseExcelData(workbook) {
                const sheets = workbook.SheetNames;
                if (!sheets.length) return [];
                const sheet = workbook.Sheets[sheets[0]];
                const json = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
                const questions = [];
                let currentCategory = '';
                let headerRow = null;
                let colMap = {};
                for (let i = 0; i < Math.min(5, json.length); i++) {
                    const row = json[i];
                    if (!row) continue;
                    if (row.some(cell => String(cell).trim() === '序号')) {
                        headerRow = i;
                        break;
                    }
                }
                if (headerRow !== null) {
                    const headers = json[headerRow].map(h => String(h).trim());
                    colMap = {
                        id: headers.indexOf('序号'),
                        type: headers.indexOf('题型'),
                        question: headers.indexOf('题目'),
                        options: headers.indexOf('选项'),
                        answer: headers.indexOf('正确答案'),
                        explanation: headers.indexOf('解析') !== -1 ? headers.indexOf('解析') : headers.indexOf('口诀'),
                        category: headers.indexOf('分类') !== -1 ? headers.indexOf('分类') : -1
                    };
                    if (colMap.question === -1 && headers.length > 1) colMap.question = 1;
                    if (colMap.id === -1 && headers.length > 0) colMap.id = 0;
                    for (let i = headerRow + 1; i < json.length; i++) {
                        const row = json[i];
                        if (!row || row.length === 0) continue;
                        const id = parseInt(row[colMap.id] || 0);
                        if (isNaN(id) || id === 0) continue;
                        const question = String(row[colMap.question] || '').trim();
                        if (!question) continue;
                        let type = String(row[colMap.type] || 'essay').trim().toLowerCase();
                        if (type.includes('单选')) type = 'single';
                        else if (type.includes('多选')) type = 'multi';
                        else if (type.includes('填空')) type = 'fill';
                        else if (type.includes('判断')) type = 'judge';
                        else type = 'essay';

                        let options = [];
                        if (colMap.options !== -1) {
                            const optStr = String(row[colMap.options] || '').trim();
                            if (optStr) {
                                options = optStr.split(/\n|;|，/).filter(s => s.trim());
                            }
                        }
                        const answer = String(row[colMap.answer] || '').trim();
                        const explanation = String(row[colMap.explanation] || '').trim();
                        const category = colMap.category !== -1 ? String(row[colMap.category] || '').trim() : currentCategory;

                        questions.push({
                            id: id,
                            category: category || '未分类',
                            question: question,
                            type: type,
                            options: options,
                            answer: answer,
                            explanation: explanation || (type === 'essay' ? '（无口诀）' : ''),
                            mnemonic: explanation || (type === 'essay' ? '（无口诀）' : '')
                        });
                    }
                } else {
                    for (let rowIdx = 0; rowIdx < json.length; rowIdx++) {
                        const row = json[rowIdx];
                        if (!row || row.length === 0) continue;
                        const firstCell = String(row[0] || '').trim();
                        if (firstCell.includes('教育学') || firstCell.includes('小三门') || firstCell.includes('心理学')) {
                            if (firstCell.includes('教育学')) currentCategory = '教育学';
                            else if (firstCell.includes('小三门')) currentCategory = '小三门';
                            else if (firstCell.includes('心理学')) currentCategory = '心理学';
                            continue;
                        }
                        const num = parseInt(firstCell, 10);
                        if (!isNaN(num) && row.length >= 3) {
                            const question = String(row[1] || '').trim();
                            const mnemonic = String(row[2] || '').trim();
                            if (question) {
                                questions.push({
                                    id: num,
                                    category: currentCategory || '未分类',
                                    question: question,
                                    type: 'essay',
                                    options: [],
                                    answer: '',
                                    explanation: mnemonic || '（无口诀）',
                                    mnemonic: mnemonic || '（无口诀）'
                                });
                            }
                        }
                    }
                }
                return questions;
            }

                            alert('选择题至少需要2个选项');

                        }
                    }
                    const answer = overlay.querySelector('#qAnswer').value.trim();
                    const explanation = overlay.querySelector('#qExplanation').value.trim();

                    const questions = allLibraries[currentLibraryId].questions;
                    const maxId = questions.reduce((max, q) => Math.max(max, q.id), 0);
                    const newId = maxId + 1;

                    const newQuestion = {
                        id: newId,
                        category: category,
                        question: question,

                        options: options,
                        answer: answer,
                        explanation: explanation || (type === 'essay' ? '（无口诀）' : ''),

                    };

                    }

            }

            // ==================== 导出题库 ====================
            function exportLibrary() {
                if (!currentLibraryId || !allLibraries[currentLibraryId]) {
                    alert('请先选择一个题库');
                    return;
                }
                const lib = allLibraries[currentLibraryId];
                const name = lib.name || '未命名题库';

                const jsonData = JSON.stringify(lib, null, 2);
                const jsonBlob = new Blob([jsonData], { type: 'application/json' });
                const jsonUrl = URL.createObjectURL(jsonBlob);
                const aJson = document.createElement('a');
                aJson.href = jsonUrl;
                aJson.download = `${name}.json`;
                document.body.appendChild(aJson);
                aJson.click();
                document.body.removeChild(aJson);
                URL.revokeObjectURL(jsonUrl);

                const questions = lib.questions || [];
                const rows = [
                    ['序号', '题型', '分类', '题目', '选项', '正确答案', '解析/口诀']
                ];
                questions.forEach(q => {
                    const optStr = (q.options || []).join('; ');
                    rows.push([
                        q.id,
                        q.type || 'essay',
                        q.category || '',
                        q.question,
                        optStr,
                        q.answer || '',
                        q.explanation || q.mnemonic || ''
                    ]);
                });
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.aoa_to_sheet(rows);
                XLSX.utils.book_append_sheet(wb, ws, '题目');
                const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
                const xlsxBlob = new Blob([wbout], { type: 'application/octet-stream' });
                const xlsxUrl = URL.createObjectURL(xlsxBlob);
                const aXlsx = document.createElement('a');
                aXlsx.href = xlsxUrl;
                aXlsx.download = `${name}.xlsx`;
                document.body.appendChild(aXlsx);
                aXlsx.click();
                document.body.removeChild(aXlsx);
                URL.revokeObjectURL(xlsxUrl);

                alert('✅ 题库已导出（JSON + XLSX）');
            }
