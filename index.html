<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>教综刷题器 · 移动升级版</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js">
    </script>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #f1f5f9;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        .app-container {
            max-width: 820px;
            width: 100%;
            height: 100%;
            max-height: 900px;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transition: border-radius 0.2s;
        }

        /* ===== 顶部头部 ===== */
        .app-header {
            padding: 20px 24px 12px 24px;
            border-bottom: 1px solid #f0f2f5;
            flex-shrink: 0;
            background: white;
            z-index: 10;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .header-top h1 {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.3px;
        }
        .header-top h1 small {
            font-size: 14px;
            font-weight: 400;
            color: #94a3b8;
            margin-left: 6px;
        }
        .stats-ring-wrapper {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #f8fafc;
            padding: 8px 16px 8px 12px;
            border-radius: 40px;
            border: 1px solid #eef2f6;
        }
        .ring-container {
            position: relative;
            width: 48px;
            height: 48px;
            flex-shrink: 0;
        }
        .ring-container svg {
            transform: rotate(-90deg);
            width: 48px;
            height: 48px;
        }
        .ring-container .bg {
            fill: none;
            stroke: #e9edf2;
            stroke-width: 5;
        }
        .ring-container .progress-ring {
            fill: none;
            stroke: #4f46e5;
            stroke-width: 5;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.6s ease, stroke 0.3s;
        }
        .ring-container .center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 13px;
            font-weight: 700;
            color: #0f172a;
        }
        .stats-text {
            display: flex;
            flex-direction: column;
            font-size: 12px;
            color: #64748b;
            line-height: 1.4;
        }
        .stats-text .num {
            font-weight: 700;
            color: #0f172a;
            font-size: 14px;
        }
        .stats-text .num.green {
            color: #16a34a;
        }
        .stats-text .num.orange {
            color: #ea580c;
        }

        .filter-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .filter-bar::-webkit-scrollbar {
            display: none;
        }
        .filter-bar select,
        .filter-bar button {
            flex-shrink: 0;
            padding: 6px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            background: white;
            font-size: 13px;
            color: #334155;
            cursor: pointer;
            transition: 0.15s;
            outline: none;
            font-weight: 500;
            height: 36px;
        }
        .filter-bar select:active,
        .filter-bar button:active {
            transform: scale(0.96);
        }
        .filter-bar select:focus,
        .filter-bar button:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        /* ===== 卡片区域 ===== */
        .card-slide-area {
            flex: 1;
            padding: 16px 20px 20px 20px;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            touch-action: pan-y;
        }
        .card-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-radius: 20px;
            border: 2px solid #edf2f7;
            padding: 24px 20px;
            transition: border-color 0.25s, background 0.25s, transform 0.15s;
            background: white;
            min-height: 240px;
            position: relative;
            touch-action: none;
        }
        .card-wrapper.mastered {
            border-color: #86efac;
            background: #f0fdf4;
        }
        .card-wrapper.review {
            border-color: #fdba74;
            background: #fff7ed;
        }
        .card-wrapper .swipe-hint {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 28px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            color: #94a3b8;
        }
        .card-wrapper .swipe-hint.left {
            left: 8px;
        }
        .card-wrapper .swipe-hint.right {
            right: 8px;
        }

        .card-question {
            font-size: 18px;
            line-height: 1.7;
            color: #0f172a;
            font-weight: 500;
            word-break: break-word;
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        .card-mnemonic {
            background: #f8fafc;
            border-radius: 12px;
            padding: 14px 18px;
            border-left: 4px solid #818cf8;
            margin: 8px 0 16px 0;
            display: none;
            flex-shrink: 0;
        }
        .card-mnemonic.show {
            display: block;
        }
        .card-mnemonic .label {
            font-size: 12px;
            font-weight: 600;
            color: #6366f1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .card-mnemonic .content {
            font-size: 15px;
            color: #1e293b;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .card-meta {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #94a3b8;
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px dashed #e9edf2;
            flex-shrink: 0;
        }
        .card-meta .badge {
            background: #eef2ff;
            color: #4f46e5;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 12px;
        }
        .card-meta .status-tag {
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-tag.mastered {
            background: #dcfce7;
            color: #166534;
        }
        .status-tag.review {
            background: #ffedd5;
            color: #9a3412;
        }
        .status-tag.none {
            background: #f1f5f9;
            color: #64748b;
        }

        .nav-buttons {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-shrink: 0;
        }
        .nav-buttons button {
            flex: 1;
            padding: 12px 0;
            border: none;
            border-radius: 14px;
            background: #f1f5f9;
            font-weight: 600;
            font-size: 15px;
            color: #1e293b;
            cursor: pointer;
            transition: 0.15s;
            touch-action: manipulation;
        }
        .nav-buttons button:active {
            transform: scale(0.94);
            background: #e2e8f0;
        }
        .nav-buttons .btn-random {
            background: #eef2ff;
            color: #4f46e5;
        }
        .nav-buttons .btn-random:active {
            background: #c7d2fe;
        }

        /* ===== 底部操作栏 ===== */
        .bottom-actions {
            flex-shrink: 0;
            background: white;
            border-top: 1px solid #f0f2f5;
            padding: 12px 16px 16px 16px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 8px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.02);
        }
        .bottom-actions button {
            padding: 12px 0;
            border: none;
            border-radius: 16px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #f8fafc;
            color: #334155;
        }
        .bottom-actions button:active {
            transform: scale(0.92);
        }
        .bottom-actions .btn-master {
            background: #dcfce7;
            color: #166534;
        }
        .bottom-actions .btn-master:active {
            background: #bbf7d0;
        }
        .bottom-actions .btn-review {
            background: #ffedd5;
            color: #9a3412;
        }
        .bottom-actions .btn-review:active {
            background: #fed7aa;
        }
        .bottom-actions .btn-reset {
            background: #fee2e2;
            color: #991b1b;
        }
        .bottom-actions .btn-reset:active {
            background: #fecaca;
        }
        .bottom-actions .btn-toggle {
            background: #eef2ff;
            color: #4f46e5;
        }
        .bottom-actions .btn-toggle:active {
            background: #c7d2fe;
        }

        /* ===== 底部工具条 ===== */
        .bottom-utils {
            flex-shrink: 0;
            padding: 8px 16px 12px 16px;
            background: #fafcff;
            border-top: 1px solid #f0f2f5;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 12px;
        }
        .bottom-utils button {
            background: none;
            border: none;
            color: #64748b;
            padding: 4px 10px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: 0.15s;
            touch-action: manipulation;
        }
        .bottom-utils button:active {
            background: #e9edf2;
        }
        .bottom-utils .danger {
            color: #ef4444;
        }
        .bottom-utils input[type="file"] {
            display: none;
        }

        /* ===== 上传界面 ===== */
        .upload-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 40px 20px;
            text-align: center;
            border: 2px dashed #cbd5e1;
            border-radius: 24px;
            background: #fafcff;
            cursor: pointer;
            transition: 0.2s;
            min-height: 300px;
        }
        .upload-placeholder .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .upload-placeholder .text {
            font-weight: 500;
            color: #334155;
        }
        .upload-placeholder .hint {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 6px;
        }
        .upload-placeholder input {
            display: none;
        }

        .empty-state {
            text-align: center;
            color: #94a3b8;
            padding: 40px 0;
            font-size: 16px;
        }

        /* ===== 复制弹窗（自定义） ===== */
        .copy-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            backdrop-filter: blur(4px);
        }
        .copy-modal {
            background: white;
            max-width: 92%;
            width: 500px;
            border-radius: 24px;
            padding: 24px 20px 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }
        .copy-modal h3 {
            font-size: 18px;
            margin-bottom: 12px;
            color: #0f172a;
        }
        .copy-modal textarea {
            width: 100%;
            height: 200px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px;
            font-size: 13px;
            font-family: monospace;
            resize: vertical;
            background: #f8fafc;
            color: #0f172a;
            flex: 1;
            min-height: 150px;
        }
        .copy-modal .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            justify-content: flex-end;
        }
        .copy-modal .modal-actions button {
            padding: 10px 24px;
            border: none;
            border-radius: 16px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.15s;
        }
        .copy-modal .modal-actions .btn-primary {
            background: #4f46e5;
            color: white;
        }
        .copy-modal .modal-actions .btn-primary:active {
            background: #4338ca;
        }
        .copy-modal .modal-actions .btn-secondary {
            background: #f1f5f9;
            color: #334155;
        }
        .copy-modal .modal-actions .btn-secondary:active {
            background: #e2e8f0;
        }

        /* ===== PC端适配 ===== */
        @media (min-width: 768px) {
            body {
                padding: 24px;
                background: #e9edf2;
            }
            .app-container {
                max-height: 95vh;
                border-radius: 28px;
                box-shadow: 0 25px 80px rgba(0, 0, 0, 0.12);
            }
            .app-header {
                padding: 24px 32px 16px 32px;
            }
            .header-top h1 {
                font-size: 26px;
            }
            .card-slide-area {
                padding: 24px 32px 20px 32px;
            }
            .card-wrapper {
                padding: 36px 40px;
                min-height: 300px;
                border-radius: 24px;
            }
            .card-question {
                font-size: 20px;
            }
            .bottom-actions {
                padding: 16px 32px 20px 32px;
                gap: 12px;
            }
            .bottom-actions button {
                font-size: 16px;
                padding: 14px 0;
                border-radius: 20px;
            }
            .bottom-actions button:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 16px rgba(0, 0, 0, 0.05);
            }
            .nav-buttons button:hover {
                background: #e2e8f0;
                transform: translateY(-1px);
            }
            .bottom-utils {
                padding: 10px 32px 16px 32px;
            }
            .bottom-utils button:hover {
                background: #e9edf2;
                color: #0f172a;
            }
            .upload-placeholder {
                min-height: 400px;
            }
        }

        @media (max-width: 400px) {
            .app-header {
                padding: 12px 16px 8px 16px;
            }
            .header-top h1 {
                font-size: 17px;
            }
            .stats-ring-wrapper {
                padding: 4px 12px 4px 8px;
                gap: 10px;
            }
            .ring-container {
                width: 40px;
                height: 40px;
            }
            .ring-container svg {
                width: 40px;
                height: 40px;
            }
            .ring-container .center-text {
                font-size: 11px;
            }
            .stats-text {
                font-size: 10px;
            }
            .card-wrapper {
                padding: 18px 16px;
                min-height: 180px;
            }
            .card-question {
                font-size: 16px;
            }
            .bottom-actions {
                padding: 8px 10px 12px 10px;
                gap: 6px;
            }
            .bottom-actions button {
                font-size: 12px;
                padding: 10px 0;
                border-radius: 12px;
            }
            .nav-buttons button {
                font-size: 13px;
                padding: 10px 0;
            }
        }
    </style>
</head>
<body>

    <div class="app-container" id="app">

        <!-- 上传界面 -->
        <div id="uploadScreen" class="upload-placeholder" style="display:flex;">
            <div class="icon">📤</div>
            <div class="text">点击上传 或 拖拽 Excel 文件</div>
            <div class="hint">支持 .xlsx / .xls，自动解析三大模块</div>
            <input type="file" id="fileInput" accept=".xlsx,.xls">
        </div>

        <!-- 主界面 -->
        <div id="mainApp" style="display:none; flex-direction:column; height:100%;">

            <!-- 头部 -->
            <div class="app-header">
                <div class="header-top">
                    <h1>📚 刷题 <small>教综</small></h1>
                    <div class="stats-ring-wrapper">
                        <div class="ring-container">
                            <svg viewBox="0 0 48 48">
                                <circle class="bg" cx="24" cy="24" r="20" />
                                <circle class="progress-ring" id="progressRing" cx="24" cy="24" r="20"
                                stroke-dasharray="125.6" stroke-dashoffset="125.6" />
                            </svg>
                            <div class="center-text" id="ringPercent">0%</div>
                        </div>
                        <div class="stats-text">
                            <span>✅ <span class="num green" id="masteredCount">0</span> 掌握</span>
                            <span>🔄 <span class="num orange" id="reviewCount">0</span> 复习</span>
                        </div>
                    </div>
                </div>
                <div class="filter-bar">
                    <select id="categoryFilter"><option value="all">📂 全部</option></select>
                    <select id="statusFilter">
                        <option value="all">📋 全部状态</option>
                        <option value="none">⏳ 未开始</option>
                        <option value="mastered">✅ 已掌握</option>
                        <option value="review">🔄 待复习</option>
                    </select>
                    <select id="modeSelect">
                        <option value="sequential">➡️ 顺序</option>
                        <option value="random">🎲 随机</option>
                    </select>
                    <button id="shuffleBtn">🔀 洗牌</button>
                </div>
            </div>

            <!-- 卡片滑动区 -->
            <div class="card-slide-area" id="cardSlideArea">
                <div class="card-wrapper" id="cardWrapper">
                    <div class="swipe-hint left">‹</div>
                    <div class="swipe-hint right">›</div>
                    <div id="cardContent">
                        <div class="empty-state">加载中...</div>
                    </div>
                    <div class="nav-buttons">
                        <button id="prevBtn">◀ 上一题</button>
                        <button id="randomBtn" class="btn-random">🎲 随机</button>
                        <button id="nextBtn">下一题 ▶</button>
                    </div>
                </div>
            </div>

            <!-- 底部固定操作栏 -->
            <div class="bottom-actions">
                <button class="btn-master" id="actionMaster">✅ 掌握</button>
                <button class="btn-review" id="actionReview">🔄 复习</button>
                <button class="btn-reset" id="actionReset">↩️ 重置</button>
                <button class="btn-toggle" id="actionToggle">👀 口诀</button>
            </div>

            <!-- 底部工具条（新增 复制进度） -->
            <div class="bottom-utils">
                <div style="display:flex; gap:4px; flex-wrap:wrap;">
                    <button id="exportBtn">📥 导出进度</button>
                    <button id="copyBtn">📋 复制进度</button>
                    <button id="importBtn">📤 导入进度</button>
                    <input type="file" id="importFileInput" accept=".json">
                </div>
                <button class="danger" id="resetAllBtn">🗑️ 重置全部</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- DOM 引用 ----------
            const uploadScreen = document.getElementById('uploadScreen');
            const mainApp = document.getElementById('mainApp');
            const fileInput = document.getElementById('fileInput');
            const categoryFilter = document.getElementById('categoryFilter');
            const statusFilter = document.getElementById('statusFilter');
            const modeSelect = document.getElementById('modeSelect');
            const shuffleBtn = document.getElementById('shuffleBtn');
            const cardContent = document.getElementById('cardContent');
            const cardWrapper = document.getElementById('cardWrapper');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const randomBtn = document.getElementById('randomBtn');
            const actionMaster = document.getElementById('actionMaster');
            const actionReview = document.getElementById('actionReview');
            const actionReset = document.getElementById('actionReset');
            const actionToggle = document.getElementById('actionToggle');
            const exportBtn = document.getElementById('exportBtn');
            const copyBtn = document.getElementById('copyBtn');
            const importBtn = document.getElementById('importBtn');
            const importFileInput = document.getElementById('importFileInput');
            const resetAllBtn = document.getElementById('resetAllBtn');
            const progressRing = document.getElementById('progressRing');
            const ringPercent = document.getElementById('ringPercent');
            const masteredCount = document.getElementById('masteredCount');
            const reviewCount = document.getElementById('reviewCount');

            // ---------- 状态 ----------
            let allQuestions = [];
            let filteredQuestions = [];
            let currentIndex = 0;
            let isMnemonicVisible = false;
            let currentMode = 'sequential';
            let currentCategory = 'all';
            let currentStatusFilter = 'all';

            // ---------- 触摸滑动 ----------
            let touchStartX = 0,
                touchStartY = 0,
                isSwiping = false;

            // ---------- 进度管理 ----------
            const STORAGE_KEY = 'studyProgress_v3';

            function loadProgress() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) return JSON.parse(raw);
                } catch (e) { /* ignore */ }
                return {};
            }

            function saveProgress(progress) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
            }

            function getQuestionStatus(qId) {
                const progress = loadProgress();
                return progress[qId] || 'none';
            }

            function setQuestionStatus(qId, status) {
                const progress = loadProgress();
                if (status === 'none') delete progress[qId];
                else progress[qId] = status;
                saveProgress(progress);
                updateStatsAndUI();
                renderCard();
            }

            // ---------- 统计 ----------
            function calcStats() {
                const total = allQuestions.length;
                let mastered = 0,
                    review = 0;
                const progress = loadProgress();
                allQuestions.forEach(q => {
                    const s = progress[q.id] || 'none';
                    if (s === 'mastered') mastered++;
                    else if (s === 'review') review++;
                });
                const pct = total > 0 ? Math.round((mastered / total) * 100) : 0;
                return { total, mastered, review, pct };
            }

            function updateStatsAndUI() {
                const stats = calcStats();
                masteredCount.textContent = stats.mastered;
                reviewCount.textContent = stats.review;
                const circumference = 125.6;
                const offset = circumference - (stats.pct / 100) * circumference;
                progressRing.style.strokeDashoffset = offset;
                ringPercent.textContent = stats.pct + '%';
                if (stats.pct >= 80) progressRing.style.stroke = '#16a34a';
                else if (stats.pct >= 40) progressRing.style.stroke = '#eab308';
                else progressRing.style.stroke = '#4f46e5';
            }

            // ---------- 渲染卡片 ----------
            function renderCard() {
                if (!filteredQuestions.length) {
                    cardContent.innerHTML = `<div class="empty-state">当前筛选无题目</div>`;
                    cardWrapper.className = 'card-wrapper';
                    updateStatsAndUI();
                    return;
                }
                if (currentIndex >= filteredQuestions.length) currentIndex = filteredQuestions.length - 1;
                if (currentIndex < 0) currentIndex = 0;

                const q = filteredQuestions[currentIndex];
                if (!q) { cardContent.innerHTML = `<div class="empty-state">加载失败</div>`; return; }

                const status = getQuestionStatus(q.id);
                cardWrapper.className = 'card-wrapper';
                if (status === 'mastered') cardWrapper.classList.add('mastered');
                else if (status === 'review') cardWrapper.classList.add('review');

                let html = `
                    <div class="card-question">${escapeHtml(q.question)}</div>
                    <div class="card-mnemonic ${isMnemonicVisible ? 'show' : ''}">
                        <div class="label">📌 口诀</div>
                        <div class="content">${escapeHtml(q.mnemonic)}</div>
                    </div>
                    <div class="card-meta">
                        <span><span class="badge">${escapeHtml(q.category || '未分类')}</span>  #${q.id}</span>
                        <span class="status-tag ${status}">
                            ${status === 'mastered' ? '✅ 已掌握' : status === 'review' ? '🔄 待复习' : '⏳ 未开始'}
                        </span>
                    </div>
                `;
                cardContent.innerHTML = html;
                updateStatsAndUI();
                actionToggle.textContent = isMnemonicVisible ? '🙈 口诀' : '👀 口诀';
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ---------- 导航 ----------
            function navigate(delta) {
                if (!filteredQuestions.length) return;
                let newIdx = currentIndex + delta;
                if (newIdx < 0) newIdx = filteredQuestions.length - 1;
                if (newIdx >= filteredQuestions.length) newIdx = 0;
                currentIndex = newIdx;
                if (currentMode === 'random') {
                    currentMode = 'sequential';
                    modeSelect.value = 'sequential';
                }
                renderCard();
            }

            function goRandom() {
                if (!filteredQuestions.length) return;
                if (currentMode !== 'random') {
                    currentMode = 'random';
                    modeSelect.value = 'random';
                }
                const randomIdx = Math.floor(Math.random() * filteredQuestions.length);
                currentIndex = randomIdx;
                renderCard();
            }

            // ---------- 筛选 ----------
            function applyFilters() {
                const category = categoryFilter.value;
                const status = statusFilter.value;
                currentCategory = category;
                currentStatusFilter = status;

                let filtered = allQuestions;
                if (category !== 'all') {
                    filtered = allQuestions.filter(q => q.category === category);
                }
                if (status !== 'all') {
                    filtered = filtered.filter(q => {
                        const s = getQuestionStatus(q.id);
                        return s === status;
                    });
                }

                filteredQuestions = filtered;
                if (filteredQuestions.length) currentIndex = 0;
                else currentIndex = 0;

                if (currentMode === 'random') shuffleArray(filteredQuestions);
                renderCard();
            }

            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
            }

            function reshuffle() {
                if (currentMode === 'random') {
                    shuffleArray(filteredQuestions);
                    currentIndex = 0;
                    renderCard();
                } else {
                    alert('当前为顺序模式，请切换到随机模式再洗牌');
                }
            }

            // ---------- 导出/复制/导入 ----------
            function getProgressDataStr() {
                return JSON.stringify(loadProgress(), null, 2);
            }

            // 尝试下载，否则弹出复制
            function exportProgress() {
                const dataStr = getProgressDataStr();
                // 尝试下载
                try {
                    const blob = new Blob([dataStr], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `study_progress_${new Date().toISOString().slice(0,10)}.json`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    return; // 下载成功
                } catch (e) {
                    // 降级：显示复制对话框
                    showCopyModal(dataStr);
                }
            }

            // 直接复制（不尝试下载）
            function copyProgress() {
                const dataStr = getProgressDataStr();
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(dataStr).then(() => {
                        alert('✅ 进度数据已复制到剪贴板，请粘贴到文本文件保存（扩展名 .json）');
                    }).catch(() => {
                        fallbackCopy(dataStr);
                    });
                } else {
                    fallbackCopy(dataStr);
                }
            }

            function fallbackCopy(text) {
                // 使用 textarea 复制
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    alert('✅ 进度数据已复制到剪贴板，请粘贴到文本文件保存（扩展名 .json）');
                } catch (e) {
                    // 如果复制失败，弹窗显示数据
                    showCopyModal(text);
                }
                document.body.removeChild(textarea);
            }

            // 自定义模态框显示 JSON
            function showCopyModal(text) {
                // 移除旧模态
                const old = document.querySelector('.copy-modal-overlay');
                if (old) old.remove();

                const overlay = document.createElement('div');
                overlay.className = 'copy-modal-overlay';
                overlay.innerHTML = `
                    <div class="copy-modal">
                        <h3>📋 请复制以下进度数据</h3>
                        <textarea readonly id="copyModalTextarea">${escapeHtml(text)}</textarea>
                        <div class="modal-actions">
                            <button class="btn-secondary" id="modalCloseBtn">关闭</button>
                            <button class="btn-primary" id="modalCopyBtn">📋 复制到剪贴板</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(overlay);

                // 关闭
                overlay.querySelector('#modalCloseBtn').addEventListener('click', () => overlay.remove());
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) overlay.remove();
                });

                // 复制
                overlay.querySelector('#modalCopyBtn').addEventListener('click', () => {
                    const ta = overlay.querySelector('#modalCopyTextarea');
                    ta.select();
                    try {
                        document.execCommand('copy');
                        alert('✅ 已复制到剪贴板！');
                    } catch (e) {
                        alert('复制失败，请手动选择文本后复制。');
                    }
                });
            }

            function importProgress(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (typeof data === 'object' && data !== null) {
                            if (confirm('导入将覆盖当前所有进度记录，确定继续吗？')) {
                                saveProgress(data);
                                updateStatsAndUI();
                                applyFilters();
                                alert('✅ 导入成功！');
                            }
                        } else {
                            alert('❌ 无效的进度文件');
                        }
                    } catch (err) {
                        alert('❌ 解析失败：' + err.message);
                    }
                };
                reader.readAsText(file);
            }

            function resetAllProgress() {
                if (confirm('确定要重置所有题目的进度吗？此操作不可撤销！')) {
                    localStorage.removeItem(STORAGE_KEY);
                    updateStatsAndUI();
                    applyFilters();
                }
            }

            // ---------- 解析 Excel ----------
            function parseExcelData(workbook) {
                const sheets = workbook.SheetNames;
                if (!sheets.length) return [];
                const sheet = workbook.Sheets[sheets[0]];
                const json = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
                const questions = [];
                let currentCategory = '';
                for (let rowIdx = 0; rowIdx < json.length; rowIdx++) {
                    const row = json[rowIdx];
                    if (!row || row.length === 0) continue;
                    const firstCell = String(row[0] || '').trim();
                    if (firstCell.includes('教育学') || firstCell.includes('小三门') || firstCell.includes('心理学')) {
                        if (firstCell.includes('教育学')) currentCategory = '教育学';
                        else if (firstCell.includes('小三门')) currentCategory = '小三门';
                        else if (firstCell.includes('心理学')) currentCategory = '心理学';
                        continue;
                    }
                    const num = parseInt(firstCell, 10);
                    if (!isNaN(num) && row.length >= 3) {
                        const question = String(row[1] || '').trim();
                        const mnemonic = String(row[2] || '').trim();
                        if (question) {
                            questions.push({
                                id: num,
                                category: currentCategory || '未分类',
                                question: question,
                                mnemonic: mnemonic || '（无口诀）'
                            });
                        }
                    }
                }
                return questions;
            }

            // ---------- 初始化 ----------
            function initMainApp() {
                const cats = new Set();
                allQuestions.forEach(q => cats.add(q.category));
                categoryFilter.innerHTML = '<option value="all">📂 全部</option>';
                cats.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c;
                    opt.textContent = c;
                    categoryFilter.appendChild(opt);
                });

                uploadScreen.style.display = 'none';
                mainApp.style.display = 'flex';

                categoryFilter.addEventListener('change', () => { isMnemonicVisible = false;
                    applyFilters(); });
                statusFilter.addEventListener('change', () => { isMnemonicVisible = false;
                    applyFilters(); });
                modeSelect.addEventListener('change', (e) => {
                    const newMode = e.target.value;
                    if (newMode === 'random' && currentMode !== 'random') {
                        shuffleArray(filteredQuestions);
                        currentIndex = 0;
                    } else if (newMode === 'sequential' && currentMode === 'random') {
                        filteredQuestions.sort((a, b) => a.id - b.id);
                        currentIndex = 0;
                    }
                    currentMode = newMode;
                    renderCard();
                });
                shuffleBtn.addEventListener('click', reshuffle);

                prevBtn.addEventListener('click', () => navigate(-1));
                nextBtn.addEventListener('click', () => navigate(1));
                randomBtn.addEventListener('click', goRandom);

                actionMaster.addEventListener('click', () => {
                    if (!filteredQuestions.length) return;
                    const q = filteredQuestions[currentIndex];
                    setQuestionStatus(q.id, 'mastered');
                });
                actionReview.addEventListener('click', () => {
                    if (!filteredQuestions.length) return;
                    const q = filteredQuestions[currentIndex];
                    setQuestionStatus(q.id, 'review');
                });
                actionReset.addEventListener('click', () => {
                    if (!filteredQuestions.length) return;
                    const q = filteredQuestions[currentIndex];
                    setQuestionStatus(q.id, 'none');
                });
                actionToggle.addEventListener('click', () => {
                    isMnemonicVisible = !isMnemonicVisible;
                    renderCard();
                });

                exportBtn.addEventListener('click', exportProgress);
                copyBtn.addEventListener('click', copyProgress);
                importBtn.addEventListener('click', () => importFileInput.click());
                importFileInput.addEventListener('change', (e) => {
                    if (e.target.files.length) {
                        importProgress(e.target.files[0]);
                        e.target.value = '';
                    }
                });
                resetAllBtn.addEventListener('click', resetAllProgress);

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowLeft') navigate(-1);
                    else if (e.key === 'ArrowRight') navigate(1);
                });

                // 触摸滑动
                const wrapper = document.getElementById('cardWrapper');
                wrapper.addEventListener('touchstart', (e) => {
                    const touch = e.touches[0];
                    touchStartX = touch.clientX;
                    touchStartY = touch.clientY;
                    isSwiping = false;
                }, { passive: true });

                wrapper.addEventListener('touchmove', (e) => {
                    if (!touchStartX) return;
                    const touch = e.touches[0];
                    const deltaX = touch.clientX - touchStartX;
                    const deltaY = touch.clientY - touchStartY;
                    if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 20) {
                        isSwiping = true;
                        e.preventDefault();
                    }
                }, { passive: false });

                wrapper.addEventListener('touchend', (e) => {
                    if (!touchStartX || !isSwiping) {
                        touchStartX = 0;
                        touchStartY = 0;
                        return;
                    }
                    const touch = e.changedTouches[0];
                    const deltaX = touch.clientX - touchStartX;
                    if (deltaX > 50) navigate(-1);
                    else if (deltaX < -50) navigate(1);
                    touchStartX = 0;
                    touchStartY = 0;
                    isSwiping = false;
                }, { passive: true });

                applyFilters();
            }

            // ---------- 文件上传 ----------
            function handleFile(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const parsed = parseExcelData(workbook);
                        if (!parsed.length) {
                            alert('未能解析出题目，请检查 Excel 格式。');
                            return;
                        }
                        allQuestions = parsed;
                        allQuestions.sort((a, b) => a.id - b.id);
                        initMainApp();
                    } catch (err) {
                        alert('解析失败：' + err.message);
                    }
                };
                reader.readAsArrayBuffer(file);
            }

            fileInput.addEventListener('change', (e) => {
                if (fileInput.files.length) handleFile(fileInput.files[0]);
            });
            uploadScreen.addEventListener('click', () => fileInput.click());
            uploadScreen.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadScreen.style.borderColor = '#4f46e5';
                uploadScreen.style.background = '#eef2ff';
            });
            uploadScreen.addEventListener('dragleave', () => {
                uploadScreen.style.borderColor = '#cbd5e1';
                uploadScreen.style.background = '#fafcff';
            });
            uploadScreen.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadScreen.style.borderColor = '#cbd5e1';
                uploadScreen.style.background = '#fafcff';
                if (e.dataTransfer.files.length) {
                    handleFile(e.dataTransfer.files[0]);
                    fileInput.files = e.dataTransfer.files;
                }
            });

            console.log('🚀 刷题器已加载（支持微信导出/复制）');
        })();
    </script>

</body>
