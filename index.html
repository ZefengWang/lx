<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>多题库刷题器 · 优化版</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js">
    </script>
    <style>
        /* ===== 全局样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #f1f5f9;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        .app-container {
            max-width: 820px;
            width: 100%;
            height: 100%;
            max-height: 900px;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* ===== 头部 ===== */
        .app-header {
            padding: 16px 24px 12px 24px;
            border-bottom: 1px solid #f0f2f5;
            flex-shrink: 0;
            background: white;
            z-index: 10;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }
        .header-top h1 {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
        }
        .header-top h1 small {
            font-size: 14px;
            font-weight: 400;
            color: #94a3b8;
            margin-left: 6px;
        }
        .library-selector {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f8fafc;
            padding: 4px 12px 4px 8px;
            border-radius: 30px;
            border: 1px solid #eef2f6;
        }
        .library-selector select {
            border: none;
            background: transparent;
            padding: 6px 4px;
            font-size: 14px;
            font-weight: 500;
            color: #0f172a;
            outline: none;
            max-width: 160px;
        }
        .library-selector button {
            background: none;
            border: none;
            color: #64748b;
            font-size: 18px;
            cursor: pointer;
            padding: 0 4px;
            transition: 0.15s;
        }
        .library-selector button:active {
            transform: scale(0.9);
        }
        .stats-ring-wrapper {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #f8fafc;
            padding: 8px 16px 8px 12px;
            border-radius: 40px;
            border: 1px solid #eef2f6;
        }
        .ring-container {
            position: relative;
            width: 48px;
            height: 48px;
            flex-shrink: 0;
        }
        .ring-container svg {
            transform: rotate(-90deg);
            width: 48px;
            height: 48px;
        }
        .ring-container .bg {
            fill: none;
            stroke: #e9edf2;
            stroke-width: 5;
        }
        .ring-container .progress-ring {
            fill: none;
            stroke: #4f46e5;
            stroke-width: 5;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.6s ease, stroke 0.3s;
        }
        .ring-container .center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 13px;
            font-weight: 700;
            color: #0f172a;
        }
        .stats-text {
            display: flex;
            flex-direction: column;
            font-size: 12px;
            color: #64748b;
            line-height: 1.4;
        }
        .stats-text .num {
            font-weight: 700;
            color: #0f172a;
            font-size: 14px;
        }
        .stats-text .num.green {
            color: #16a34a;
        }
        .stats-text .num.orange {
            color: #ea580c;
        }
        .filter-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .filter-bar::-webkit-scrollbar {
            display: none;
        }
        .filter-bar select,
        .filter-bar button {
            flex-shrink: 0;
            padding: 6px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            background: white;
            font-size: 13px;
            color: #334155;
            cursor: pointer;
            transition: 0.15s;
            outline: none;
            font-weight: 500;
            height: 36px;
        }
        .filter-bar select:active,
        .filter-bar button:active {
            transform: scale(0.96);
        }
        .filter-bar select:focus,
        .filter-bar button:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        /* ===== 卡片滑动区 ===== */
        .card-slide-area {
            flex: 1;
            padding: 16px 20px 8px 20px;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            touch-action: pan-y;
        }
        .card-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-radius: 20px;
            border: 2px solid #edf2f7;
            padding: 24px 20px 16px 20px;
            transition: border-color 0.25s, background 0.25s;
            background: white;
            min-height: 240px;
            position: relative;
            touch-action: none;
        }
        .card-wrapper.mastered {
            border-color: #86efac;
            background: #f0fdf4;
        }
        .card-wrapper.review {
            border-color: #fdba74;
            background: #fff7ed;
        }
        /* 滑动提示箭头（仅作为装饰，实际手势引导由 toast 完成） */
        .card-wrapper .swipe-hint {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 28px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            color: #94a3b8;
        }
        .card-wrapper .swipe-hint.left {
            left: 8px;
        }
        .card-wrapper .swipe-hint.right {
            right: 8px;
        }
        .card-question {
            font-size: 18px;
            line-height: 1.7;
            color: #0f172a;
            font-weight: 500;
            word-break: break-word;
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        .card-mnemonic {
            background: #f8fafc;
            border-radius: 12px;
            padding: 14px 18px;
            border-left: 4px solid #818cf8;
            margin: 8px 0 12px 0;
            display: none;
            flex-shrink: 0;
        }
        .card-mnemonic.show {
            display: block;
        }
        .card-mnemonic .label {
            font-size: 12px;
            font-weight: 600;
            color: #6366f1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .card-mnemonic .content {
            font-size: 15px;
            color: #1e293b;
            white-space: pre-wrap;
            word-break: break-word;
        }
        /* 卡片内按钮组：提示 + 导航 */
        .card-inner-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
            flex-shrink: 0;
        }
        .card-inner-actions .hint-btn {
            background: #eef2ff;
            color: #4f46e5;
            border: none;
            border-radius: 20px;
            padding: 8px 18px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
            touch-action: manipulation;
            flex: 0 1 auto;
        }
        .card-inner-actions .hint-btn:active {
            transform: scale(0.94);
            background: #c7d2fe;
        }
        .card-inner-actions .hint-btn.showing {
            background: #f1f5f9;
            color: #64748b;
        }
        .card-inner-actions .nav-group {
            display: flex;
            gap: 6px;
            flex: 1 1 auto;
            justify-content: flex-end;
        }
        .card-inner-actions .nav-group button {
            padding: 8px 14px;
            border: none;
            border-radius: 20px;
            background: #f1f5f9;
            font-weight: 500;
            font-size: 14px;
            color: #1e293b;
            cursor: pointer;
            transition: 0.15s;
            touch-action: manipulation;
            white-space: nowrap;
        }
        .card-inner-actions .nav-group button:active {
            transform: scale(0.94);
            background: #e2e8f0;
        }
        .card-inner-actions .nav-group .random-btn {
            background: #eef2ff;
            color: #4f46e5;
        }
        .card-inner-actions .nav-group .random-btn:active {
            background: #c7d2fe;
        }
        .card-meta {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #94a3b8;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed #e9edf2;
            flex-shrink: 0;
        }
        .card-meta .badge {
            background: #eef2ff;
            color: #4f46e5;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 12px;
        }
        .card-meta .status-tag {
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-tag.mastered {
            background: #dcfce7;
            color: #166534;
        }
        .status-tag.review {
            background: #ffedd5;
            color: #9a3412;
        }
        .status-tag.none {
            background: #f1f5f9;
            color: #64748b;
        }
        /* ===== 底部操作栏（掌握/复习/重置/帮助） ===== */
        .bottom-actions {
            flex-shrink: 0;
            background: white;
            border-top: 1px solid #f0f2f5;
            padding: 12px 16px 16px 16px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 8px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.02);
        }
        .bottom-actions button {
            padding: 12px 0;
            border: none;
            border-radius: 16px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #f8fafc;
            color: #334155;
        }
        .bottom-actions button:active {
            transform: scale(0.92);
        }
        .bottom-actions .btn-master {
            background: #dcfce7;
            color: #166534;
        }
        .bottom-actions .btn-master:active {
            background: #bbf7d0;
        }
        .bottom-actions .btn-review {
            background: #ffedd5;
            color: #9a3412;
        }
        .bottom-actions .btn-review:active {
            background: #fed7aa;
        }
        .bottom-actions .btn-reset {
            background: #fee2e2;
            color: #991b1b;
        }
        .bottom-actions .btn-reset:active {
            background: #fecaca;
        }
        .bottom-actions .btn-help {
            background: #eef2ff;
            color: #4f46e5;
        }
        .bottom-actions .btn-help:active {
            background: #c7d2fe;
        }
        /* ===== 底部工具条（导出/导入等） ===== */
        .bottom-utils {
            flex-shrink: 0;
            padding: 8px 16px 12px 16px;
            background: #fafcff;
            border-top: 1px solid #f0f2f5;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            font-size: 12px;
        }
        .bottom-utils .left-group {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .bottom-utils .right-group {
            display: flex;
            gap: 4px;
        }
        .bottom-utils button {
            background: none;
            border: none;
            color: #64748b;
            padding: 4px 10px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: 0.15s;
            touch-action: manipulation;
            white-space: nowrap;
        }
        .bottom-utils button:active {
            background: #e9edf2;
        }
        .bottom-utils .danger {
            color: #ef4444;
        }
        .bottom-utils input[type="file"] {
            display: none;
        }
        /* ===== 上传界面 ===== */
        .upload-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 40px 20px;
            text-align: center;
            border: 2px dashed #cbd5e1;
            border-radius: 24px;
            background: #fafcff;
            cursor: pointer;
            transition: 0.2s;
            min-height: 300px;
        }
        .upload-placeholder .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .upload-placeholder .text {
            font-weight: 500;
            color: #334155;
        }
        .upload-placeholder .hint {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 6px;
        }
        .upload-placeholder input {
            display: none;
        }
        .empty-state {
            text-align: center;
            color: #94a3b8;
            padding: 40px 0;
            font-size: 16px;
        }
        /* ===== 模态框 ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            backdrop-filter: blur(4px);
        }
        .modal-box {
            background: white;
            max-width: 92%;
            width: 500px;
            border-radius: 24px;
            padding: 24px 20px 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }
        .modal-box h3 {
            font-size: 18px;
            margin-bottom: 12px;
            color: #0f172a;
        }
        .modal-box .help-content {
            overflow-y: auto;
            padding: 4px 0;
            font-size: 15px;
            line-height: 1.8;
            color: #334155;
        }
        .modal-box .help-content li {
            list-style: none;
            padding: 6px 0;
            border-bottom: 1px solid #f0f2f5;
        }
        .modal-box .help-content li:last-child {
            border-bottom: none;
        }
        .modal-box .help-content .icon {
            margin-right: 8px;
        }
        .modal-box textarea {
            width: 100%;
            height: 200px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px;
            font-size: 13px;
            font-family: monospace;
            resize: vertical;
            background: #f8fafc;
            color: #0f172a;
            flex: 1;
            min-height: 150px;
        }
        .modal-box input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 12px;
            outline: none;
        }
        .modal-box input[type="text"]:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        .modal-box .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            justify-content: flex-end;
        }
        .modal-box .modal-actions button {
            padding: 10px 24px;
            border: none;
            border-radius: 16px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.15s;
        }
        .modal-box .modal-actions .btn-primary {
            background: #4f46e5;
            color: white;
        }
        .modal-box .modal-actions .btn-primary:active {
            background: #4338ca;
        }
        .modal-box .modal-actions .btn-secondary {
            background: #f1f5f9;
            color: #334155;
        }
        .modal-box .modal-actions .btn-secondary:active {
            background: #e2e8f0;
        }
        /* ===== Toast 提示（引导） ===== */
        .toast-tip {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(6px);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.5s ease;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast-tip.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-10px);
            pointer-events: auto;
        }
        .toast-tip .close-tip {
            margin-left: 12px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-size: 16px;
            cursor: pointer;
            pointer-events: auto;
            vertical-align: middle;
        }
        .toast-tip .close-tip:active {
            background: rgba(255, 255, 255, 0.4);
        }
        /* ===== 响应式 ===== */
        @media (min-width: 768px) {
            body {
                padding: 24px;
                background: #e9edf2;
            }
            .app-container {
                max-height: 95vh;
                border-radius: 28px;
                box-shadow: 0 25px 80px rgba(0, 0, 0, 0.12);
            }
            .app-header {
                padding: 24px 32px 16px 32px;
            }
            .header-top h1 {
                font-size: 26px;
            }
            .card-slide-area {
                padding: 24px 32px 12px 32px;
            }
            .card-wrapper {
                padding: 36px 40px 20px 40px;
                min-height: 300px;
                border-radius: 24px;
            }
            .card-question {
                font-size: 20px;
            }
            .bottom-actions {
                padding: 16px 32px 20px 32px;
                gap: 12px;
            }
            .bottom-actions button {
                font-size: 16px;
                padding: 14px 0;
                border-radius: 20px;
            }
            .bottom-actions button:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 16px rgba(0, 0, 0, 0.05);
            }
            .bottom-utils {
                padding: 10px 32px 16px 32px;
            }
            .bottom-utils button:hover {
                background: #e9edf2;
                color: #0f172a;
            }
            .upload-placeholder {
                min-height: 400px;
            }
            .card-inner-actions .nav-group button:hover {
                background: #e2e8f0;
            }
            .card-inner-actions .hint-btn:hover {
                background: #c7d2fe;
            }
        }
        @media (max-width: 400px) {
            .app-header {
                padding: 12px 16px 8px 16px;
            }
            .header-top h1 {
                font-size: 17px;
            }
            .stats-ring-wrapper {
                padding: 4px 12px 4px 8px;
                gap: 10px;
            }
            .ring-container {
                width: 40px;
                height: 40px;
            }
            .ring-container svg {
                width: 40px;
                height: 40px;
            }
            .ring-container .center-text {
                font-size: 11px;
            }
            .stats-text {
                font-size: 10px;
            }
            .card-wrapper {
                padding: 18px 16px 12px 16px;
                min-height: 180px;
            }
            .card-question {
                font-size: 16px;
            }
            .bottom-actions {
                padding: 8px 10px 12px 10px;
                gap: 6px;
            }
            .bottom-actions button {
                font-size: 12px;
                padding: 10px 0;
                border-radius: 12px;
            }
            .bottom-utils {
                padding: 6px 10px 10px 10px;
                font-size: 11px;
            }
            .bottom-utils button {
                font-size: 11px;
                padding: 4px 8px;
            }
            .card-inner-actions .nav-group button {
                font-size: 12px;
                padding: 6px 10px;
            }
            .card-inner-actions .hint-btn {
                font-size: 12px;
                padding: 6px 14px;
            }
        }
        /* ===== 隐藏滚动条 ===== */
        .card-slide-area::-webkit-scrollbar {
            width: 4px;
        }
        .card-slide-area::-webkit-scrollbar-thumb {
            background: #d1d9e6;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="app-container" id="app">

        <!-- 上传界面 -->
        <div id="uploadScreen" class="upload-placeholder" style="display:flex;">
            <div class="icon">📤</div>
            <div class="text">点击上传 或 拖拽 Excel 文件</div>
            <div class="hint">支持 .xlsx / .xls，自动解析三大模块</div>
            <input type="file" id="fileInput" accept=".xlsx,.xls">
        </div>

        <!-- 主界面 -->
        <div id="mainApp" style="display:none; flex-direction:column; height:100%;">

            <!-- 头部 -->
            <div class="app-header">
                <div class="header-top">
                    <h1>📚 刷题 <small>多题库</small></h1>
                    <div class="library-selector">
                        <span style="font-size:13px;color:#64748b;">📂</span>
                        <select id="librarySelect"></select>
                        <button id="deleteLibraryBtn" title="删除当前题库">🗑️</button>
                        <button id="addLibraryBtn" title="上传新题库">➕</button>
                    </div>
                    <div class="stats-ring-wrapper">
                        <div class="ring-container">
                            <svg viewBox="0 0 48 48">
                                <circle class="bg" cx="24" cy="24" r="20" />
                                <circle class="progress-ring" id="progressRing" cx="24" cy="24" r="20"
                                stroke-dasharray="125.6" stroke-dashoffset="125.6" />
                            </svg>
                            <div class="center-text" id="ringPercent">0%</div>
                        </div>
                        <div class="stats-text">
                            <span>✅ <span class="num green" id="masteredCount">0</span> 掌握</span>
                            <span>🔄 <span class="num orange" id="reviewCount">0</span> 复习</span>
                        </div>
                    </div>
                </div>
                <div class="filter-bar">
                    <select id="categoryFilter"><option value="all">📂 全部</option></select>
                    <select id="statusFilter">
                        <option value="all">📋 全部状态</option>
                        <option value="none">⏳ 未开始</option>
                        <option value="mastered">✅ 已掌握</option>
                        <option value="review">🔄 待复习</option>
                    </select>
                    <select id="modeSelect">
                        <option value="sequential">➡️ 顺序</option>
                        <option value="random">🎲 随机</option>
                    </select>
                    <button id="shuffleBtn">🔀 洗牌</button>
                </div>
            </div>

            <!-- 卡片滑动区 -->
            <div class="card-slide-area" id="cardSlideArea">
                <div class="card-wrapper" id="cardWrapper">
                    <div class="swipe-hint left">‹</div>
                    <div class="swipe-hint right">›</div>
                    <div id="cardContent">
                        <div class="empty-state">加载中...</div>
                    </div>
                    <!-- 卡片内操作栏：提示 + 导航 -->
                    <div class="card-inner-actions" id="cardInnerActions">
                        <button class="hint-btn" id="hintBtn">💡 提示</button>
                        <div class="nav-group">
                            <button id="prevBtn">◀ 上一题</button>
                            <button id="randomBtn" class="random-btn">🎲 随机</button>
                            <button id="nextBtn">下一题 ▶</button>
                        </div>
                    </div>
                    <div class="card-meta" id="cardMeta">
                        <span><span class="badge" id="categoryBadge">未分类</span>  #<span id="questionId">0</span></span>
                        <span class="status-tag none" id="statusTag">⏳ 未开始</span>
                    </div>
                </div>
            </div>

            <!-- 底部操作栏 -->
            <div class="bottom-actions">
                <button class="btn-master" id="actionMaster">✅ 掌握</button>
                <button class="btn-review" id="actionReview">🔄 复习</button>
                <button class="btn-reset" id="actionReset">↩️ 重置</button>
                <button class="btn-help" id="helpBtn">❓ 帮助</button>
            </div>

            <!-- 底部工具条 -->
            <div class="bottom-utils">
                <div class="left-group">
                    <button id="exportBtn">📥 导出进度</button>
                    <button id="copyBtn">📋 复制进度</button>
                    <button id="pasteImportBtn">📋 从剪贴板导入</button>
                    <button id="importBtn">📤 导入文件</button>
                    <input type="file" id="importFileInput" accept=".json">
                </div>
                <div class="right-group">
                    <button id="resetAllBtn" class="danger">🗑️ 重置全部</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast 引导提示 -->
    <div id="toastTip" class="toast-tip">
        👆 左右滑动卡片切换题目 &nbsp;|&nbsp; 💡 点击“提示”查看口诀
        <button class="close-tip" id="closeTipBtn">✕</button>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- DOM 引用 ----------
            const uploadScreen = document.getElementById('uploadScreen');
            const mainApp = document.getElementById('mainApp');
            const fileInput = document.getElementById('fileInput');
            const librarySelect = document.getElementById('librarySelect');
            const deleteLibraryBtn = document.getElementById('deleteLibraryBtn');
            const addLibraryBtn = document.getElementById('addLibraryBtn');
            const categoryFilter = document.getElementById('categoryFilter');
            const statusFilter = document.getElementById('statusFilter');
            const modeSelect = document.getElementById('modeSelect');
            const shuffleBtn = document.getElementById('shuffleBtn');
            const cardContent = document.getElementById('cardContent');
            const cardWrapper = document.getElementById('cardWrapper');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const randomBtn = document.getElementById('randomBtn');
            const hintBtn = document.getElementById('hintBtn');
            const actionMaster = document.getElementById('actionMaster');
            const actionReview = document.getElementById('actionReview');
            const actionReset = document.getElementById('actionReset');
            const helpBtn = document.getElementById('helpBtn');
            const exportBtn = document.getElementById('exportBtn');
            const copyBtn = document.getElementById('copyBtn');
            const pasteImportBtn = document.getElementById('pasteImportBtn');
            const importBtn = document.getElementById('importBtn');
            const importFileInput = document.getElementById('importFileInput');
            const resetAllBtn = document.getElementById('resetAllBtn');
            const progressRing = document.getElementById('progressRing');
            const ringPercent = document.getElementById('ringPercent');
            const masteredCount = document.getElementById('masteredCount');
            const reviewCount = document.getElementById('reviewCount');
            const categoryBadge = document.getElementById('categoryBadge');
            const questionId = document.getElementById('questionId');
            const statusTag = document.getElementById('statusTag');
            const toastTip = document.getElementById('toastTip');
            const closeTipBtn = document.getElementById('closeTipBtn');

            // ---------- 全局状态 ----------
            let allLibraries = {};
            let currentLibraryId = null;
            let currentQuestions = [];
            let filteredQuestions = [];
            let currentIndex = 0;
            let isMnemonicVisible = false; // 当前题目是否显示口诀
            let currentMode = 'sequential';
            let currentCategory = 'all';
            let currentStatusFilter = 'all';

            // ---------- 存储键 ----------
            const LIBRARY_LIST_KEY = 'studyLibraries_v4';
            const PROGRESS_KEY = 'studyProgress_v4';
            const TOAST_SHOWN_KEY = 'studyToastShown';

            // ---------- 进度管理 ----------
            function loadLibraries() {
                try {
                    const raw = localStorage.getItem(LIBRARY_LIST_KEY);
                    if (raw) return JSON.parse(raw);
                } catch (e) { /* ignore */ }
                return {};
            }

            function saveLibraries(libs) {
                localStorage.setItem(LIBRARY_LIST_KEY, JSON.stringify(libs));
            }

            function loadProgress() {
                try {
                    const raw = localStorage.getItem(PROGRESS_KEY);
                    if (raw) return JSON.parse(raw);
                } catch (e) { /* ignore */ }
                return {};
            }

            function saveProgress(progress) {
                localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
            }

            function getLibraryProgress(libId) {
                const all = loadProgress();
                return all[libId] || {};
            }

            function setLibraryProgress(libId, progress) {
                const all = loadProgress();
                all[libId] = progress;
                saveProgress(all);
            }

            function getQuestionStatus(libId, qId) {
                const prog = getLibraryProgress(libId);
                return prog[qId] || 'none';
            }

            function setQuestionStatus(libId, qId, status) {
                const prog = getLibraryProgress(libId);
                if (status === 'none') delete prog[qId];
                else prog[qId] = status;
                setLibraryProgress(libId, prog);
                updateStatsAndUI();
                renderCard();
            }

            function resetAllProgressForLibrary(libId) {
                if (confirm(`确定要重置题库“${allLibraries[libId].name}”的所有进度吗？`)) {
                    setLibraryProgress(libId, {});
                    updateStatsAndUI();
                    renderCard();
                }
            }

            // ---------- 统计 ----------
            function calcStatsForLibrary(libId) {
                const questions = allLibraries[libId]?.questions || [];
                const total = questions.length;
                const prog = getLibraryProgress(libId);
                let mastered = 0,
                    review = 0;
                questions.forEach(q => {
                    const s = prog[q.id] || 'none';
                    if (s === 'mastered') mastered++;
                    else if (s === 'review') review++;
                });
                const pct = total > 0 ? Math.round((mastered / total) * 100) : 0;
                return { total, mastered, review, pct };
            }

            function updateStatsAndUI() {
                if (!currentLibraryId || !allLibraries[currentLibraryId]) {
                    masteredCount.textContent = '0';
                    reviewCount.textContent = '0';
                    ringPercent.textContent = '0%';
                    progressRing.style.strokeDashoffset = 125.6;
                    return;
                }
                const stats = calcStatsForLibrary(currentLibraryId);
                masteredCount.textContent = stats.mastered;
                reviewCount.textContent = stats.review;
                const circumference = 125.6;
                const offset = circumference - (stats.pct / 100) * circumference;
                progressRing.style.strokeDashoffset = offset;
                ringPercent.textContent = stats.pct + '%';
                if (stats.pct >= 80) progressRing.style.stroke = '#16a34a';
                else if (stats.pct >= 40) progressRing.style.stroke = '#eab308';
                else progressRing.style.stroke = '#4f46e5';
            }

            // ---------- 渲染卡片 ----------
            function renderCard() {
                if (!currentLibraryId || !allLibraries[currentLibraryId]) {
                    cardContent.innerHTML = `<div class="empty-state">请先上传或选择一个题库</div>`;
                    cardWrapper.className = 'card-wrapper';
                    updateStatsAndUI();
                    return;
                }
                const questions = currentQuestions;
                if (!questions.length) {
                    cardContent.innerHTML = `<div class="empty-state">当前题库为空</div>`;
                    cardWrapper.className = 'card-wrapper';
                    updateStatsAndUI();
                    return;
                }
                if (!filteredQuestions.length) {
                    cardContent.innerHTML = `<div class="empty-state">当前筛选无题目</div>`;
                    cardWrapper.className = 'card-wrapper';
                    updateStatsAndUI();
                    return;
                }
                if (currentIndex >= filteredQuestions.length) currentIndex = filteredQuestions.length - 1;
                if (currentIndex < 0) currentIndex = 0;

                const q = filteredQuestions[currentIndex];
                if (!q) { cardContent.innerHTML = `<div class="empty-state">加载失败</div>`; return; }

                const status = getQuestionStatus(currentLibraryId, q.id);
                cardWrapper.className = 'card-wrapper';
                if (status === 'mastered') cardWrapper.classList.add('mastered');
                else if (status === 'review') cardWrapper.classList.add('review');

                // 更新卡片meta
                categoryBadge.textContent = q.category || '未分类';
                questionId.textContent = q.id;
                statusTag.className = 'status-tag ' + status;
                statusTag.textContent = status === 'mastered' ? '✅ 已掌握' : status === 'review' ? '🔄 待复习' : '⏳ 未开始';

                // 构建题目和口诀
                let html = `
                    <div class="card-question">${escapeHtml(q.question)}</div>
                    <div class="card-mnemonic ${isMnemonicVisible ? 'show' : ''}">
                        <div class="label">📌 口诀</div>
                        <div class="content">${escapeHtml(q.mnemonic)}</div>
                    </div>
                `;
                cardContent.innerHTML = html;

                // 更新提示按钮状态
                hintBtn.textContent = isMnemonicVisible ? '🙈 隐藏口诀' : '💡 提示';
                hintBtn.className = 'hint-btn' + (isMnemonicVisible ? ' showing' : '');

                updateStatsAndUI();
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ---------- 导航 ----------
            function navigate(delta) {
                if (!filteredQuestions.length) return;
                // 切换题目时，重置口诀显示
                if (isMnemonicVisible) {
                    isMnemonicVisible = false;
                }
                let newIdx = currentIndex + delta;
                if (newIdx < 0) newIdx = filteredQuestions.length - 1;
                if (newIdx >= filteredQuestions.length) newIdx = 0;
                currentIndex = newIdx;
                if (currentMode === 'random') {
                    currentMode = 'sequential';
                    modeSelect.value = 'sequential';
                }
                renderCard();
            }

            function goRandom() {
                if (!filteredQuestions.length) return;
                // 切换题目时，重置口诀显示
                if (isMnemonicVisible) {
                    isMnemonicVisible = false;
                }
                if (currentMode !== 'random') {
                    currentMode = 'random';
                    modeSelect.value = 'random';
                }
                const randomIdx = Math.floor(Math.random() * filteredQuestions.length);
                currentIndex = randomIdx;
                renderCard();
            }

            // ---------- 提示按钮切换 ----------
            function toggleHint() {
                if (!currentLibraryId || !filteredQuestions.length) return;
                isMnemonicVisible = !isMnemonicVisible;
                renderCard();
            }

            // ---------- 筛选 ----------
            function applyFilters() {
                if (!currentLibraryId || !allLibraries[currentLibraryId]) {
                    filteredQuestions = [];
                    renderCard();
                    return;
                }
                const questions = allLibraries[currentLibraryId].questions || [];
                const category = categoryFilter.value;
                const status = statusFilter.value;
                currentCategory = category;
                currentStatusFilter = status;

                let filtered = questions;
                if (category !== 'all') {
                    filtered = filtered.filter(q => q.category === category);
                }
                if (status !== 'all') {
                    filtered = filtered.filter(q => {
                        const s = getQuestionStatus(currentLibraryId, q.id);
                        return s === status;
                    });
                }

                filteredQuestions = filtered;
                if (filteredQuestions.length) currentIndex = 0;
                else currentIndex = 0;

                // 重置口诀显示
                isMnemonicVisible = false;

                if (currentMode === 'random') shuffleArray(filteredQuestions);
                renderCard();
            }

            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
            }

            function reshuffle() {
                if (currentMode === 'random') {
                    shuffleArray(filteredQuestions);
                    currentIndex = 0;
                    isMnemonicVisible = false;
                    renderCard();
                } else {
                    alert('当前为顺序模式，请切换到随机模式再洗牌');
                }
            }

            // ---------- 题库管理 ----------
            function loadAllLibraries() {
                allLibraries = loadLibraries();
                Object.keys(allLibraries).forEach(id => {
                    if (!allLibraries[id].id) allLibraries[id].id = id;
                });
                updateLibrarySelector();
                const lastLib = localStorage.getItem('lastLibraryId');
                if (lastLib && allLibraries[lastLib]) {
                    switchToLibrary(lastLib);
                } else {
                    const ids = Object.keys(allLibraries);
                    if (ids.length) {
                        switchToLibrary(ids[0]);
                    } else {
                        uploadScreen.style.display = 'flex';
                        mainApp.style.display = 'none';
                        currentLibraryId = null;
                        currentQuestions = [];
                        filteredQuestions = [];
                        renderCard();
                    }
                }
            }

            function updateLibrarySelector() {
                const current = librarySelect.value;
                librarySelect.innerHTML = '';
                Object.keys(allLibraries).forEach(id => {
                    const opt = document.createElement('option');
                    opt.value = id;
                    opt.textContent = allLibraries[id].name || '未命名题库';
                    librarySelect.appendChild(opt);
                });
                if (current && allLibraries[current]) {
                    librarySelect.value = current;
                } else if (Object.keys(allLibraries).length) {
                    librarySelect.value = Object.keys(allLibraries)[0];
                }
            }

            function switchToLibrary(libId) {
                if (!allLibraries[libId]) return;
                currentLibraryId = libId;
                currentQuestions = allLibraries[libId].questions || [];
                localStorage.setItem('lastLibraryId', libId);
                librarySelect.value = libId;
                // 更新分类下拉
                const cats = new Set();
                currentQuestions.forEach(q => cats.add(q.category));
                categoryFilter.innerHTML = '<option value="all">📂 全部</option>';
                cats.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c;
                    opt.textContent = c;
                    categoryFilter.appendChild(opt);
                });
                // 重置口诀
                isMnemonicVisible = false;
                applyFilters();
            }

            function deleteLibrary(libId) {
                if (!allLibraries[libId]) return;
                if (!confirm(`确定要删除题库“${allLibraries[libId].name}”及其所有进度吗？`)) return;
                delete allLibraries[libId];
                saveLibraries(allLibraries);
                const allProgress = loadProgress();
                delete allProgress[libId];
                saveProgress(allProgress);
                const ids = Object.keys(allLibraries);
                if (ids.length) {
                    switchToLibrary(ids[0]);
                } else {
                    uploadScreen.style.display = 'flex';
                    mainApp.style.display = 'none';
                    currentLibraryId = null;
                    currentQuestions = [];
                    filteredQuestions = [];
                    renderCard();
                }
                updateLibrarySelector();
            }

            function addNewLibrary(name, questions) {
                const id = 'lib_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
                allLibraries[id] = { id, name, questions };
                saveLibraries(allLibraries);
                setLibraryProgress(id, {});
                updateLibrarySelector();
                switchToLibrary(id);
                uploadScreen.style.display = 'none';
                mainApp.style.display = 'flex';
            }

            // ---------- 上传新题库（去重） ----------
            function handleFileUpload(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const parsed = parseExcelData(workbook);
                        if (!parsed.length) {
                            alert('未能解析出题目，请检查 Excel 格式。');
                            return;
                        }
                        parsed.sort((a, b) => a.id - b.id);

                        const matchedId = findMatchingLibrary(parsed);
                        if (matchedId) {
                            const libName = allLibraries[matchedId].name;
                            if (confirm(`检测到题库“${libName}”与当前上传内容相同，是否切换到该题库？\n（点击“确定”切换，点击“取消”仍新建）`)) {
                                switchToLibrary(matchedId);
                                uploadScreen.style.display = 'none';
                                mainApp.style.display = 'flex';
                                return;
                            }
                        }

                        const defaultName = file.name.replace(/\.[^.]+$/, '');
                        promptForLibraryName(defaultName, (name) => {
                            if (name) {
                                addNewLibrary(name, parsed);
                            }
                        });
                    } catch (err) {
                        alert('解析失败：' + err.message);
                    }
                };
                reader.readAsArrayBuffer(file);
            }

            function findMatchingLibrary(questions) {
                const sortedNew = [...questions].sort((a, b) => a.id - b.id);
                const ids = Object.keys(allLibraries);
                for (let id of ids) {
                    const existing = allLibraries[id].questions;
                    if (existing.length !== sortedNew.length) continue;
                    const sortedExisting = [...existing].sort((a, b) => a.id - b.id);
                    if (JSON.stringify(sortedExisting) === JSON.stringify(sortedNew)) {
                        return id;
                    }
                }
                return null;
            }

            function promptForLibraryName(defaultName, callback) {
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.innerHTML = `
                    <div class="modal-box">
                        <h3>📚 新建题库</h3>
                        <input type="text" id="libNameInput" placeholder="输入题库名称..." value="${escapeHtml(defaultName)}">
                        <div class="modal-actions">
                            <button class="btn-secondary" id="modalCancelBtn">取消</button>
                            <button class="btn-primary" id="modalConfirmBtn">确定</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(overlay);
                const input = overlay.querySelector('#libNameInput');
                input.focus();
                input.select();

                const close = () => overlay.remove();
                overlay.querySelector('#modalCancelBtn').addEventListener('click', () => {
                    close();
                    callback(null);
                });
                overlay.querySelector('#modalConfirmBtn').addEventListener('click', () => {
                    const name = input.value.trim() || defaultName;
                    close();
                    callback(name);
                });
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) { close();
                        callback(null); }
                });
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        const name = input.value.trim() || defaultName;
                        close();
                        callback(name);
                    }
                });
            }

            // ---------- 解析 Excel ----------
            function parseExcelData(workbook) {
                const sheets = workbook.SheetNames;
                if (!sheets.length) return [];
                const sheet = workbook.Sheets[sheets[0]];
                const json = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
                const questions = [];
                let currentCategory = '';
                for (let rowIdx = 0; rowIdx < json.length; rowIdx++) {
                    const row = json[rowIdx];
                    if (!row || row.length === 0) continue;
                    const firstCell = String(row[0] || '').trim();
                    if (firstCell.includes('教育学') || firstCell.includes('小三门') || firstCell.includes('心理学')) {
                        if (firstCell.includes('教育学')) currentCategory = '教育学';
                        else if (firstCell.includes('小三门')) currentCategory = '小三门';
                        else if (firstCell.includes('心理学')) currentCategory = '心理学';
                        continue;
                    }
                    const num = parseInt(firstCell, 10);
                    if (!isNaN(num) && row.length >= 3) {
                        const question = String(row[1] || '').trim();
                        const mnemonic = String(row[2] || '').trim();
                        if (question) {
                            questions.push({
                                id: num,
                                category: currentCategory || '未分类',
                                question: question,
                                mnemonic: mnemonic || '（无口诀）'
                            });
                        }
                    }
                }
                return questions;
            }

            // ---------- 导出/导入进度 ----------
            function getExportData() {
                return JSON.stringify(loadProgress(), null, 2);
            }

            function exportAllProgress() {
                const dataStr = getExportData();
                try {
                    const blob = new Blob([dataStr], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `all_progress_${new Date().toISOString().slice(0,10)}.json`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                } catch (e) {
                    showModal('📋 导出全部进度', dataStr, '复制', (text) => {
                        copyToClipboard(text);
                    });
                }
            }

            function copyAllProgress() {
                const dataStr = getExportData();
                copyToClipboard(dataStr);
            }

            function importProgressFromPaste() {
                showModal('📋 从剪贴板导入进度（覆盖所有题库进度）', '', '导入', (text) => {
                    try {
                        const data = JSON.parse(text);
                        if (typeof data === 'object' && data !== null) {
                            if (confirm('导入将覆盖当前所有题库的进度记录，确定继续吗？')) {
                                saveProgress(data);
                                if (currentLibraryId && allLibraries[currentLibraryId]) {
                                    switchToLibrary(currentLibraryId);
                                } else {
                                    applyFilters();
                                }
                                alert('✅ 导入成功！');
                            }
                        } else {
                            alert('❌ 无效的进度数据');
                        }
                    } catch (err) {
                        alert('❌ 解析失败：' + err.message);
                    }
                });
            }

            function importProgressFromFile(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (typeof data === 'object' && data !== null) {
                            if (confirm('导入将覆盖当前所有题库的进度记录，确定继续吗？')) {
                                saveProgress(data);
                                if (currentLibraryId && allLibraries[currentLibraryId]) {
                                    switchToLibrary(currentLibraryId);
                                } else {
                                    applyFilters();
                                }
                                alert('✅ 导入成功！');
                            }
                        } else {
                            alert('❌ 无效的进度文件');
                        }
                    } catch (err) {
                        alert('❌ 解析失败：' + err.message);
                    }
                };
                reader.readAsText(file);
            }

            // ---------- 通用模态框（用于帮助和导入导出） ----------
            function showModal(title, initialText, actionLabel, onAction) {
                const old = document.querySelector('.modal-overlay');
                if (old) old.remove();

                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.innerHTML = `
                    <div class="modal-box">
                        <h3>${title}</h3>
                        <textarea id="modalTextarea">${escapeHtml(initialText)}</textarea>
                        <div class="modal-actions">
                            <button class="btn-secondary" id="modalCloseBtn">关闭</button>
                            <button class="btn-primary" id="modalActionBtn">${actionLabel}</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(overlay);

                const closeModal = () => overlay.remove();
                overlay.querySelector('#modalCloseBtn').addEventListener('click', closeModal);
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) closeModal();
                });

                overlay.querySelector('#modalActionBtn').addEventListener('click', () => {
                    const text = overlay.querySelector('#modalTextarea').value;
                    onAction(text);
                    closeModal();
                });
            }

            // ---------- 帮助弹窗 ----------
            function showHelp() {
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.innerHTML = `
                    <div class="modal-box">
                        <h3>❓ 使用帮助</h3>
                        <div class="help-content">
                            <ul>
                                <li><span class="icon">👆</span> <strong>左右滑动</strong>卡片快速切换题目</li>
                                <li><span class="icon">💡</span> 点击卡片内的 <strong>“提示”</strong> 查看口诀（切换题目后自动隐藏）</li>
                                <li><span class="icon">⬅️➡️</span> 使用 <strong>“上一题/下一题”</strong> 按钮或键盘方向键</li>
                                <li><span class="icon">🎲</span> 点击 <strong>“随机”</strong> 跳转至随机题目</li>
                                <li><span class="icon">✅🔄</span> 底部 <strong>“掌握/复习”</strong> 标记题目状态，<strong>“重置”</strong> 取消标记</li>
                                <li><span class="icon">📂</span> 顶部下拉框 <strong>切换不同题库</strong>，➕ 上传新题库，🗑️ 删除题库</li>
                                <li><span class="icon">📊</span> 顶部环形进度显示当前题库掌握百分比</li>
                                <li><span class="icon">💾</span> 底部 <strong>“导出/导入”</strong> 可备份所有题库进度，跨设备迁移</li>
                            </ul>
                        </div>
                        <div class="modal-actions">
                            <button class="btn-primary" id="helpCloseBtn">知道了</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(overlay);
                overlay.querySelector('#helpCloseBtn').addEventListener('click', () => overlay.remove());
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) overlay.remove();
                });
            }

            // ---------- 复制工具 ----------
            function copyToClipboard(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        alert('✅ 已复制到剪贴板！');
                    }).catch(() => {
                        fallbackCopy(text);
                    });
                } else {
                    fallbackCopy(text);
                }
            }

            function fallbackCopy(text) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    alert('✅ 已复制到剪贴板！');
                } catch (e) {
                    alert('❌ 复制失败，请手动复制。');
                }
                document.body.removeChild(textarea);
            }

            // ---------- 触摸滑动 ----------
            let touchStartX = 0,
                touchStartY = 0,
                isSwiping = false;

            // ---------- Toast 引导 ----------
            function showToast() {
                const shown = localStorage.getItem(TOAST_SHOWN_KEY);
                if (shown) return;
                toastTip.classList.add('show');
                // 5秒后自动隐藏
                setTimeout(() => {
                    toastTip.classList.remove('show');
                    localStorage.setItem(TOAST_SHOWN_KEY, 'true');
                }, 6000);
            }

            // ---------- 事件绑定 ----------
            function bindEvents() {
                librarySelect.addEventListener('change', (e) => {
                    const id = e.target.value;
                    if (id && allLibraries[id]) {
                        switchToLibrary(id);
                    }
                });

                deleteLibraryBtn.addEventListener('click', () => {
                    if (currentLibraryId) deleteLibrary(currentLibraryId);
                });

                addLibraryBtn.addEventListener('click', () => {
                    uploadScreen.style.display = 'flex';
                    mainApp.style.display = 'none';
                });

                categoryFilter.addEventListener('change', () => { isMnemonicVisible = false;
                    applyFilters(); });
                statusFilter.addEventListener('change', () => { isMnemonicVisible = false;
                    applyFilters(); });
                modeSelect.addEventListener('change', (e) => {
                    const newMode = e.target.value;
                    if (newMode === 'random' && currentMode !== 'random') {
                        shuffleArray(filteredQuestions);
                        currentIndex = 0;
                    } else if (newMode === 'sequential' && currentMode === 'random') {
                        filteredQuestions.sort((a, b) => a.id - b.id);
                        currentIndex = 0;
                    }
                    currentMode = newMode;
                    isMnemonicVisible = false;
                    renderCard();
                });
                shuffleBtn.addEventListener('click', reshuffle);

                prevBtn.addEventListener('click', () => navigate(-1));
                nextBtn.addEventListener('click', () => navigate(1));
                randomBtn.addEventListener('click', goRandom);
                hintBtn.addEventListener('click', toggleHint);

                actionMaster.addEventListener('click', () => {
                    if (!currentLibraryId || !filteredQuestions.length) return;
                    const q = filteredQuestions[currentIndex];
                    setQuestionStatus(currentLibraryId, q.id, 'mastered');
                });
                actionReview.addEventListener('click', () => {
                    if (!currentLibraryId || !filteredQuestions.length) return;
                    const q = filteredQuestions[currentIndex];
                    setQuestionStatus(currentLibraryId, q.id, 'review');
                });
                actionReset.addEventListener('click', () => {
                    if (!currentLibraryId || !filteredQuestions.length) return;
                    const q = filteredQuestions[currentIndex];
                    setQuestionStatus(currentLibraryId, q.id, 'none');
                });
                helpBtn.addEventListener('click', showHelp);

                exportBtn.addEventListener('click', exportAllProgress);
                copyBtn.addEventListener('click', copyAllProgress);
                pasteImportBtn.addEventListener('click', importProgressFromPaste);
                importBtn.addEventListener('click', () => importFileInput.click());
                importFileInput.addEventListener('change', (e) => {
                    if (e.target.files.length) {
                        importProgressFromFile(e.target.files[0]);
                        e.target.value = '';
                    }
                });
                resetAllBtn.addEventListener('click', () => {
                    if (currentLibraryId) resetAllProgressForLibrary(currentLibraryId);
                });

                // 键盘
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowLeft') navigate(-1);
                    else if (e.key === 'ArrowRight') navigate(1);
                });

                // 触摸滑动
                const wrapper = document.getElementById('cardWrapper');
                wrapper.addEventListener('touchstart', (e) => {
                    const touch = e.touches[0];
                    touchStartX = touch.clientX;
                    touchStartY = touch.clientY;
                    isSwiping = false;
                }, { passive: true });

                wrapper.addEventListener('touchmove', (e) => {
                    if (!touchStartX) return;
                    const touch = e.touches[0];
                    const deltaX = touch.clientX - touchStartX;
                    const deltaY = touch.clientY - touchStartY;
                    if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 20) {
                        isSwiping = true;
                        e.preventDefault();
                    }
                }, { passive: false });

                wrapper.addEventListener('touchend', (e) => {
                    if (!touchStartX || !isSwiping) {
                        touchStartX = 0;
                        touchStartY = 0;
                        return;
                    }
                    const touch = e.changedTouches[0];
                    const deltaX = touch.clientX - touchStartX;
                    if (deltaX > 50) navigate(-1);
                    else if (deltaX < -50) navigate(1);
                    touchStartX = 0;
                    touchStartY = 0;
                    isSwiping = false;
                }, { passive: true });

                // 文件上传
                fileInput.addEventListener('change', (e) => {
                    if (fileInput.files.length) handleFileUpload(fileInput.files[0]);
                });
                uploadScreen.addEventListener('click', () => fileInput.click());
                uploadScreen.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    uploadScreen.style.borderColor = '#4f46e5';
                    uploadScreen.style.background = '#eef2ff';
                });
                uploadScreen.addEventListener('dragleave', () => {
                    uploadScreen.style.borderColor = '#cbd5e1';
                    uploadScreen.style.background = '#fafcff';
                });
                uploadScreen.addEventListener('drop', (e) => {
                    e.preventDefault();
                    uploadScreen.style.borderColor = '#cbd5e1';
                    uploadScreen.style.background = '#fafcff';
                    if (e.dataTransfer.files.length) {
                        handleFileUpload(e.dataTransfer.files[0]);
                        fileInput.files = e.dataTransfer.files;
                    }
                });

                // 关闭 Toast 提示
                closeTipBtn.addEventListener('click', () => {
                    toastTip.classList.remove('show');
                    localStorage.setItem(TOAST_SHOWN_KEY, 'true');
                });
            }

            // ---------- 初始化 ----------
            function init() {
                bindEvents();
                loadAllLibraries();
                if (Object.keys(allLibraries).length === 0) {
                    uploadScreen.style.display = 'flex';
                    mainApp.style.display = 'none';
                } else {
                    uploadScreen.style.display = 'none';
                    mainApp.style.display = 'flex';
                    // 显示引导提示（仅首次）
                    setTimeout(showToast, 800);
                }
            }

            init();
            console.log('🚀 优化版刷题器已加载');
        })();
    </script>
</body>
</html>
