<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <meta name="description" content="刷题器 - 移动端优先的本地刷题应用">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="刷题器">
    <!-- 应用图标：紫底圆 + 白书 + 绿对勾（SVG 矢量，任意尺寸不糊） -->
    <link rel="icon" type="image/svg+xml" href="./src/render/assets/logo.svg">
    <link rel="apple-touch-icon" href="./src/render/assets/logo.svg">
    <title>刷题器</title>

    <!-- 第三方依赖：SheetJS / PDF.js -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <!-- 设计 Token 与全局 reset（必须先于 components.css） -->
    <link rel="stylesheet" href="./src/render/theme.css">
    <!-- 基础组件样式 -->
    <link rel="stylesheet" href="./src/render/components.css">

    <style>
        /* 应用级最小补丁（仅本页专属） */
        html, body { height: 100%; }
        #app {
            display: flex;
            flex-direction: column;
            min-height: 100dvh;
            background: var(--lx-bg);
        }
        /* 首次加载占位（main.js 启动前显示） */
        #app:empty::before {
            content: "加载中…";
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            color: var(--lx-text-muted);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <!-- 主应用入口（核心层 + API 层 + Render 层） -->
    <script type="module" src="./src/main.js"></script>
</body>
</html>
