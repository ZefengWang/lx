plugins {
    id 'com.android.application'
}

// androidx 库传递依赖旧 kotlin-stdlib-jdk7/jdk8（1.6.x），而新版 kotlin-stdlib(1.8+)
// 已合并其类，会导致 Duplicate class；统一排除旧分片，保留新 stdlib
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

// 版本号与仓库根 version.txt 保持同步（web 发版后 CI 构建 APK 自动跟随）
// 注意：file() 相对本模块目录（android/app/），仓库根需上两级
def versionFile = file('../../version.txt')
def appVersion = versionFile.exists() ? versionFile.text.trim() : '0.0.1'
// versionCode：由版本号派生（3.2.4 → 30204），保证为正整数且递增
def codeMajor = (appVersion =~ /^(\d+)/)[0][1] as int
def codeParts = (appVersion =~ /^(\d+)\.(\d+)(?:\.(\d+))?/)[0]
def versionCodeValue = codeMajor * 10000 + (codeParts[2] as int) * 100 + (codeParts.size() > 3 && codeParts[3] ? codeParts[3] as int : 0)
// 兜底：任何情况不得为 0（Android 要求正数）
if (versionCodeValue < 1) versionCodeValue = 1

android {
    namespace 'com.zfwang.lx'
    compileSdk 34

    defaultConfig {
        applicationId "com.zfwang.lx"
        minSdk 24
        targetSdk 34
        versionCode versionCodeValue
        versionName appVersion
    }

    buildTypes {
        release {
            minifyEnabled false
            // 用 Android 自动生成的 debug keystore 签名，保证 release APK 可直接安装；
            // 如需正式签名（上架/稳定升级），配置 keystore 后改用正式签名即可。
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
