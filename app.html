<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <meta name="description" content="刷题器 - 移动端优先的本地刷题应用">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="刷题器">
    <!-- 应用图标：紫底圆 + 白书 + 绿对勾（SVG 矢量，任意尺寸不糊） -->
    <link rel="icon" type="image/svg+xml" href="./src/render/assets/logo.svg">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="manifest" href="./manifest.json">
    <title>刷题器</title>

    <!-- 第三方依赖：SheetJS / PDF.js -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <!-- 设计 Token 与全局 reset（必须先于 components.css） -->
    <link rel="stylesheet" href="./src/render/theme.css">
    <!-- 基础组件样式 -->
    <link rel="stylesheet" href="./src/render/components.css">

    <style>
        /* 应用级最小补丁（仅本页专属） */
        html, body { height: 100%; }
        #app {
            display: flex;
            flex-direction: column;
            min-height: 100dvh;
            background: var(--lx-bg);
        }
        /* 首次加载占位（main.js 启动前显示） */
        #app:empty::before {
            content: "加载中…";
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            color: var(--lx-text-muted);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <!-- 主应用入口（核心层 + API 层 + Render 层）
         加 ?v= 版本号：强制浏览器/SW 绕开旧 main.js 缓存，新版本发布后用户首次访问即可拉到最新代码 -->
    <script type="module" src="./src/main.js?v=3.2.1"></script>
    <script>
        // PWA：相对 scope 适配 GitHub Pages 子路径
        //
        // ?test=1 模式：在 app.html 层面内联清 SW + CacheStorage（不依赖 main.js），
        // 避免"清缓存的 bootstrap 被旧缓存污染、跑不到"的鸡生蛋问题。清完自动刷新一次。
        // 非 test 模式：正常注册带版本号的新 SW（CACHE_VERSION 升级时自动清旧缓存）。
        (function () {
            if (!('serviceWorker' in navigator)) return;
            var isTest = location.search.indexOf('test=1') >= 0;

            if (isTest) {
                // 内联清 SW + 缓存，不依赖 main.js/bootstrap
                window.addEventListener('load', function () {
                    navigator.serviceWorker.getRegistrations().then(function (regs) {
                        var hadSW = regs.length > 0;
                        return Promise.all(regs.map(function (r) { return r.unregister(); }))
                            .then(function () {
                                if (window.caches) {
                                    return caches.keys().then(function (keys) {
                                        return Promise.all(
                                            keys.filter(function (k) { return k.indexOf('lx-') === 0; })
                                                .map(function (k) { return caches.delete(k); })
                                        );
                                    });
                                }
                            })
                            .then(function () {
                                if (hadSW) {
                                    // 清完缓存刷新：reload 后无 SW，所有资源走网络拿全新代码
                                    location.reload();
                                }
                            });
                    }).catch(function (e) { console.warn('[lx] test 模式清缓存失败:', e); });
                });
                return;
            }

            // 正常注册新 SW（版本号变化触发 update，skipWaiting+claim 自动清旧缓存）
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('./sw.js?v=3.2.1', { scope: './' })
                    .catch(function (err) { console.warn('[lx] SW 注册失败:', err); });
            });
        })();
    </script>
</body>
</html>
