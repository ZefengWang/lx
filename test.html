<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刷题器 - 测试控制台</title>
    <link rel="stylesheet" href="test-style.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
    <div class="test-header">
        <h1>
            🧪 刷题器测试控制台
            <small id="version">loading...</small>
            <span class="status-indicator loading" id="status">加载中</span>
        </h1>
        <div class="actions">
            <button class="btn" id="runBtn" disabled>▶ 运行全部</button>
            <button class="btn secondary" id="clearBtn">清空结果</button>
        </div>
    </div>

    <div class="test-warning">
        ⚠️ 测试模式：运行测试会清空当前题库与进度数据。系统会自动备份，可用 <code style="background:#451a03;padding:2px 6px;border-radius:4px">LX.TestAPI.undoLast()</code> 回滚。
    </div>

    <div class="test-summary" id="summary">
        <span class="badge pass">通过 0</span>
        <span class="badge fail">失败 0</span>
        <span class="badge skip">跳过 0</span>
        <span class="badge duration">耗时 -</span>
    </div>

    <div class="test-results" id="results">
        <div style="padding:40px;text-align:center;color:#64748b;">点击"运行全部"开始测试</div>
    </div>

    <div class="repl">
        <h2>REPL（在 window.LX 上下文执行）</h2>
        <textarea id="replInput" placeholder="// 输入 JS 代码，例如：LX.LibraryAPI.list()&#10;// 或：LX.TestAPI.seed('small')&#10;// 或：LX.QuestionAPI.answer(1, 'B')"></textarea>
        <div style="margin-top:8px;display:flex;gap:8px;">
            <button class="btn" id="replRunBtn">▶ 运行</button>
            <button class="btn secondary" id="replClearBtn">清空</button>
        </div>
        <div class="output" id="replOutput">// 结果将显示在这里</div>
    </div>

    <!-- 主应用入口 -->
    <script type="module" src="./src/main.js"></script>

    <!-- 测试入口 -->
    <script type="module">
        import { runAll, getSuites, formatResults } from './test/runner.js';
        import { waitForLX } from './test/helpers.js';
        // 注册所有测试套件
        await import('./test/index.js');

        const $ = (id) => document.getElementById(id);
        const runBtn = $('runBtn');
        const status = $('status');
        const versionEl = $('version');
        const summaryEl = $('summary');
        const resultsEl = $('results');

        let _results = null;

        // 等待 LX 就绪
        try {
            const LX = await waitForLX(8000);
            versionEl.textContent = `v${LX.version}`;
            status.textContent = '就绪';
            status.className = 'status-indicator ready';
            runBtn.disabled = false;
        } catch (e) {
            status.textContent = '加载失败';
            status.className = 'status-indicator error';
            resultsEl.innerHTML = `<div style="padding:20px;color:#fca5a5;">LX 加载失败：${e.message}<br>请用 http://localhost:8080/test.html 访问（非 file://）</div>`;
        }

        function updateSummary(r) {
            const dur = r.endTime ? `${r.duration}ms` : '进行中...';
            summaryEl.innerHTML = `
                <span class="badge pass">通过 ${r.passed}</span>
                <span class="badge fail">失败 ${r.failed}</span>
                <span class="badge skip">跳过 ${r.skipped}</span>
                <span class="badge duration">耗时 ${dur}</span>
            `;
        }

        function renderResults(r) {
            _results = r;
            updateSummary(r);
            const html = r.suites.map((suite) => {
                const icon = suite.failed > 0 ? '✗' : '✓';
                const iconClass = suite.failed > 0 ? 'fail' : 'pass';
                const testsHtml = suite.tests.map((t) => {
                    if (t.status === 'skip') {
                        return `<div class="test-item skip"><span class="icon">○</span><span class="name">${t.name}</span></div>`;
                    }
                    if (t.status === 'pass') {
                        return `<div class="test-item pass"><span class="icon">✓</span><span class="name">${t.name}</span><span class="duration">${t.duration}ms</span></div>`;
                    }
                    const err = t.error || {};
                    const detail = err.message ? `<div class="error-detail">Error: ${err.message}${err.expected ? `\nExpected: ${JSON.stringify(err.expected)}` : ''}${err.actual != null ? `\nActual: ${JSON.stringify(err.actual)}` : ''}${err.stack ? `\n\n${err.stack.split('\n').slice(0, 4).join('\n')}` : ''}</div>` : '';
                    return `<div class="test-item fail"><span class="icon">✗</span><span class="name">${t.name}${detail}</span></div>`;
                }).join('');
                return `
                    <div class="suite">
                        <div class="suite-header" data-suite="${suite.name}">
                            <span class="icon ${iconClass}">${icon}</span>
                            <span>${suite.name}</span>
                            <span class="count">${suite.passed}/${suite.tests.length} 通过</span>
                        </div>
                        <div class="test-list">${testsHtml}</div>
                    </div>
                `;
            }).join('');
            resultsEl.innerHTML = html;

            // 折叠/展开
            resultsEl.querySelectorAll('.suite-header').forEach((header) => {
                header.addEventListener('click', () => {
                    const list = header.nextElementSibling;
                    list.classList.toggle('expanded');
                });
                // 默认展开失败套件
                const suite = r.suites.find((s) => s.name === header.dataset.suite);
                if (suite && suite.failed > 0) {
                    header.nextElementSibling.classList.add('expanded');
                }
            });
        }

        runBtn.addEventListener('click', async () => {
            runBtn.disabled = true;
            runBtn.textContent = '⏳ 运行中...';
            // 启用自动确认（避免每个测试弹 confirm）
            if (window.LX && window.LX.TestAPI) {
                window.LX.TestAPI._enableAutoConfirm();
            }
            try {
                const r = await runAll(updateSummary);
                renderResults(r);
                console.log(formatResults(r));
            } catch (e) {
                resultsEl.innerHTML = `<div style="padding:20px;color:#fca5a5;">运行错误：${e.message}<br><pre>${e.stack}</pre></div>`;
            } finally {
                runBtn.disabled = false;
                runBtn.textContent = '▶ 运行全部';
            }
        });

        $('clearBtn').addEventListener('click', () => {
            _results = null;
            resultsEl.innerHTML = '<div style="padding:40px;text-align:center;color:#64748b;">点击"运行全部"开始测试</div>';
            updateSummary({ passed: 0, failed: 0, skipped: 0, duration: '-' });
        });

        // REPL
        const replInput = $('replInput');
        const replOutput = $('replOutput');
        $('replRunBtn').addEventListener('click', async () => {
            const code = replInput.value.trim();
            if (!code) return;
            try {
                const fn = new Function('LX', `return (async () => ${code})()`);
                const result = await fn(window.LX);
                if (result instanceof Blob) {
                    replOutput.className = 'output';
                    replOutput.textContent = `Blob { size: ${result.size}, type: "${result.type}" }`;
                } else {
                    replOutput.className = 'output';
                    replOutput.textContent = typeof result === 'object' ? JSON.stringify(result, null, 2) : String(result);
                }
            } catch (e) {
                replOutput.className = 'output error';
                replOutput.textContent = `Error: ${e.message}\n${e.stack || ''}`;
            }
        });
        $('replClearBtn').addEventListener('click', () => {
            replInput.value = '';
            replOutput.className = 'output';
            replOutput.textContent = '// 结果将显示在这里';
        });
        replInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                $('replRunBtn').click();
            }
        });
    </script>
</body>
</html>
